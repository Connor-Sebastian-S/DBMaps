        // In Three.js r160, each addGeometry() call is itself an independently
        // transformed/visible entry. The separate addInstance() API belongs to later
        // revisions; keep this r160 batch capacity sized for each feature using this GLB.
        const maxGeometryCount = Math.max(1, group.parts.length * urlModelCount);
        const verticesPerModel = group.parts.reduce((n, part) => n + part.geometry.attributes.position.count, 0);
        const indicesPerModel = group.parts.reduce((n, part) => n + part.geometry.index.count, 0);
        const maxVertices = Math.max(1, verticesPerModel * urlModelCount);
        const maxIndices = Math.max(1, indicesPerModel * urlModelCount);
        const batch = new THREE.BatchedMesh(maxGeometryCount, maxVertices, maxIndices, group.material);
        batch.perObjectFrustumCulled = true;
        batch.sortObjects = false;
        batch.userData.itemsByBatchId = new Map();
        batch.userData.modelUrl = url;
        modelRoot.add(batch);
        modelBatches.add(batch);
        for (const part of group.parts) {
          // Retain the source geometry in the URL template: addGeometry copies it into the
          // batch buffer for each building that references this GLB.
          part.entry = { meshIndex: part.meshIndex, meshMatrix: meshMatrices[part.meshIndex], batch, geometry: part.geometry };
          entries.push(part.entry);
        }
      }
      entries.sort((a, b) => a.meshIndex - b.meshIndex);
      return { entries, meshCount, rootPosition, rootRotation, fallbackReason: null };
    })();
    modelTemplateCache.set(url, pending);
    try { return await pending; }
    catch (err) { modelTemplateCache.delete(url); throw err; }
  }

  function modelBaseMatrix(item) {
    const rootRotation = item.rootRotation.clone();
    rootRotation.y = item.rotationY;
    const rootQuaternion = new THREE.Quaternion().setFromEuler(rootRotation);
    const modelTransform = new THREE.Matrix4().compose(item.rootPosition, rootQuaternion,
      new THREE.Vector3(item.scale, item.scale, item.scale));
    return new THREE.Matrix4().makeTranslation(item.e, item.n, item.z + item.dz).multiply(rotX).multiply(modelTransform);
  }

  function setModelMatrix(item) {
    if (item.instances.length) {
      const baseMatrix = modelBaseMatrix(item);
      for (const ref of item.instances)
        ref.batch.setMatrixAt(ref.batchId, baseMatrix.clone().multiply(ref.meshMatrix));
    }
    if (item.fallbackObject) {
      // Keep the same transform convention as the original, pre-batching model loader:
      // the holder places the model at the building/terrain, while the GLTF scene itself
      // retains its own root transform and receives model_scale/model_rot.
      item.fallbackObject.matrix.makeTranslation(item.e, item.n, item.z + item.dz).multiply(rotX);
      item.fallbackObject.updateMatrixWorld(true);
    }
  }

  // Marker GLBs are geometry-only companions, but their mesh object origins are the actual
  // emitter locations. Convert those origins from marker-local coordinates through the exact
  // same building transform used by the rendered GLB.
  const chimneyMarkerCache = new Map();
  function loadChimneyMarkerPoints(url, loader) {
    let pending = chimneyMarkerCache.get(url);
    if (!pending) {
      pending = loader.loadAsync(url).then(gltf => {
        const root = gltf.scene;
        root.updateMatrixWorld(true);
        const rootInverse = root.matrixWorld.clone().invert();
        const points = [];
        root.traverse(node => {
          if (!node.isMesh || !node.geometry?.attributes?.position) return;
          const localMatrix = rootInverse.clone().multiply(node.matrixWorld);
          const point = new THREE.Vector3().setFromMatrixPosition(localMatrix);
          if (Number.isFinite(point.x) && Number.isFinite(point.y) && Number.isFinite(point.z)) points.push(point);
        });
        return points;
      }).catch(() => {
        // Marker companions are optional. A missing file is normal for most buildings.
        return [];
      });
      chimneyMarkerCache.set(url, pending);
    }
    return pending;
  }

  // The light companion is also just a set of separate marker meshes. Each cube's object
  // origin becomes a lamp source; the actual cube geometry is never added to the visible scene.
  const lightMarkerCache = new Map();
  function loadLightMarkerPoints(url, loader) {
    let pending = lightMarkerCache.get(url);
    if (!pending) {
      pending = loader.loadAsync(url).then(gltf => {
        const root = gltf.scene;
        root.updateMatrixWorld(true);
        const rootInverse = root.matrixWorld.clone().invert();
        const points = [];
        root.traverse(node => {
          if (!node.isMesh || !node.geometry?.attributes?.position) return;
          const localMatrix = rootInverse.clone().multiply(node.matrixWorld);
          const point = new THREE.Vector3().setFromMatrixPosition(localMatrix);
          if (Number.isFinite(point.x) && Number.isFinite(point.y) && Number.isFinite(point.z)) points.push(point);
        });
        return points;
      }).catch(() => {
        // Light companions are optional. Most buildings do not have artificial lamp markers.
        return [];
      });
      lightMarkerCache.set(url, pending);
    }
    return pending;
  }

  function updateLampLightVisibility() {
    const night = $('nightMode').checked;
    let count = 0;
    for (const item of modelItems) {
      const group = item.lampLightGroup;
      if (!group) continue;
      const active = night && buildingModelsVisible && item.visible;
      group.visible = active;
      if (active) count += (item.lightPoints || []).length;
    }
    activeLampEmitters = count;
    lampLightRoot.visible = night && count > 0;
  }

  function createLampLights(item, markerPoints) {
    if (item.lampLightGroup) {
      lampLightRoot.remove(item.lampLightGroup);
      item.lampLightGroup.traverse(obj => {
        if (obj.isLight) obj.dispose?.();
      });
    }
    const group = new THREE.Group();
    group.name = `lamp-lights-${item.id}`;
    const buildingTransform = modelBaseMatrix(item);
    item.lightPoints = markerPoints.map(point => point.clone().applyMatrix4(buildingTransform));

    for (let i = 0; i < item.lightPoints.length; i++) {
      const position = item.lightPoints[i];

      // A short-range point light gives the lantern a warm local halo and lights nearby masonry.
      const point = new THREE.PointLight(0xffc477, 22, 16, 2);
      point.position.copy(position);
      point.castShadow = false;
      point.name = `lamp-${item.id}-${i + 1}-point`;
      group.add(point);

      // A downward spotlight creates a soft pool on the bridge deck. The local map coordinate
      // system uses +Z as up, so -Z points down towards the road/walkway.
      const spot = new THREE.SpotLight(0xffc477, 32, 23, Math.PI / 5, 0.72, 2);
      spot.position.copy(position);
      spot.castShadow = false;
      spot.name = `lamp-${item.id}-${i + 1}-spot`;
      spot.target.position.copy(position).add(new THREE.Vector3(0, 0, -5));
      group.add(spot, spot.target);
    }

    item.lampLightGroup = group;
    lampLightRoot.add(group);
    updateLampLightVisibility();
    map.triggerRepaint();
  }

  function rebuildSmokeParticles() {
    if (smokeMesh) {
      smokeGroup.remove(smokeMesh);
      smokeMesh.geometry.dispose();
      smokeMesh = null;
    }
    const positions = [], phases = [], seeds = [], sizes = [], rises = [], active = [];
    for (const item of modelItems) {
      item.smokeParticleRanges = [];
      const points = item.chimneyPoints || [];
      for (let emitterIndex = 0; emitterIndex < points.length; emitterIndex++) {
        const start = phases.length;
        const seedText = `${item.id}:${emitterIndex}`;
        let seed = 2166136261;
        for (let i = 0; i < seedText.length; i++) seed = Math.imul(seed ^ seedText.charCodeAt(i), 16777619);
        const rnd = mulberry32(seed >>> 0);
        for (let i = 0; i < SMOKE_PARTICLES_PER_CHIMNEY; i++) {
          const point = points[emitterIndex];
          positions.push(point.x, point.y, point.z);
          phases.push((i + rnd() * 0.28) / SMOKE_PARTICLES_PER_CHIMNEY);
          seeds.push(rnd() * 100.0);
          sizes.push(1.05 + rnd() * 0.8);
          rises.push(7.0 + rnd() * 5.0);
          active.push(item.visible ? 1 : 0);
        }
        item.smokeParticleRanges.push({ start, count: SMOKE_PARTICLES_PER_CHIMNEY });
      }
    }
    smokeParticleCount = phases.length;
    if (!smokeParticleCount) {
      activeSmokeEmitters = 0;
      syncAnim();
      map.triggerRepaint();
      return;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('aPhase', new THREE.Float32BufferAttribute(phases, 1));
    geometry.setAttribute('aSeed', new THREE.Float32BufferAttribute(seeds, 1));
    geometry.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
    geometry.setAttribute('aRise', new THREE.Float32BufferAttribute(rises, 1));
    geometry.setAttribute('aActive', new THREE.Float32BufferAttribute(active, 1));
    smokeMesh = new THREE.Points(geometry, smokeMaterial);
    smokeMesh.name = 'all-chimney-smoke-particles';
    smokeMesh.frustumCulled = false;
    smokeMesh.renderOrder = 12;
    smokeGroup.add(smokeMesh);
    updateSmokeActive();
    map.triggerRepaint();
  }

  function scheduleSmokeRebuild() {
    if (smokeRebuildTimer !== null) return;
    smokeRebuildTimer = setTimeout(() => {
      smokeRebuildTimer = null;
      rebuildSmokeParticles();
      updateStatus();
    }, 120);
  }

  function updateSmokeActive() {
    let activeCount = 0;
    const attr = smokeMesh?.geometry?.getAttribute('aActive');
    for (const item of modelItems) {
      const isActive = item.visible ? 1 : 0;
      if (isActive) activeCount += (item.chimneyPoints || []).length;
      if (attr) for (const range of item.smokeParticleRanges || [])
        attr.array.fill(isActive, range.start, range.start + range.count);
    }
    if (attr) attr.needsUpdate = true;
    activeSmokeEmitters = activeCount;
    syncAnim();
  }

  // Some valid GLBs contain features that r160 BatchedMesh cannot represent (notably
  // interleaved vertex attributes). Render those with the original Object3D hierarchy so
  // their geometry, materials, and per-node transforms are preserved exactly.
  function addStandaloneModel(item, sourceScene, reason) {
    const clone = sourceScene.clone(true);
    clone.scale.setScalar(item.scale);
    clone.rotation.y = item.rotationY;
    clone.updateMatrix();
    const holder = new THREE.Group();
    holder.matrixAutoUpdate = false;
    holder.visible = false;
    holder.add(clone);
    holder.userData.item = item;
    item.fallbackObject = holder;
    modelRoot.add(holder);
    modelFallbackRoots.add(holder);
    setModelMatrix(item);
    modelFallbackCount++;
    console.warn(`Model ${item.id} (${item.props.model}) is using standalone rendering: ${reason}`);
  }

  function discardPartialBatchEntries(item) {
    for (const ref of item.instances) {
      ref.batch.userData.itemsByBatchId.delete(ref.batchId);
      ref.batch.setVisibleAt(ref.batchId, false);
      ref.batch.deleteGeometry(ref.batchId);
    }
    item.instances.length = 0;
  }

  function updateModelVisibility() {
    const y = year();
    modelsShown = 0;
    for (const item of modelItems) {
      const visible = item.from <= y && y <= item.to;
      if (item.visible !== visible) {
        item.visible = visible;
        for (const ref of item.instances) ref.batch.setVisibleAt(ref.batchId, visible);
        if (item.fallbackObject) item.fallbackObject.visible = visible;
      }
      if (visible) modelsShown++;
    }
    updateSmokeActive();
    updateLampLightVisibility();
    map.triggerRepaint();
  }

  // BatchedMesh ray intersections expose batchId; each batch maps that id back to its building.
  const raycaster = new THREE.Raycaster();
  const _inv = new THREE.Matrix4(), _ra = new THREE.Vector3(), _rb = new THREE.Vector3();
  function pickModel(pt) {
    const cv = map.getCanvas();
    const nx = (pt.x / cv.clientWidth) * 2 - 1, ny = 1 - (pt.y / cv.clientHeight) * 2;
    _inv.fromArray(lastMatrix).multiply(localToMerc).invert();
    _ra.set(nx, ny, -1).applyMatrix4(_inv);
    _rb.set(nx, ny, 1).applyMatrix4(_inv);
    raycaster.ray.origin.copy(_ra);
    raycaster.ray.direction.copy(_rb).sub(_ra).normalize();
    const hits = raycaster.intersectObjects([...modelBatches, ...modelFallbackRoots], true);
    for (const hit of hits) {
      if (hit.object.isBatchedMesh) {
        const item = hit.object.userData.itemsByBatchId?.get(hit.batchId);
        if (item?.visible) return item;
      } else {
        let object = hit.object;
        while (object && !object.userData.item) object = object.parent;
        if (object?.userData.item?.visible) return object.userData.item;
      }
    }
    return null;
  }

  // Railway meshes are generated one GLB per source rail feature. Their manifest anchors are
  // the midpoint of each feature, with ballast bottom at local Y=0. Convert the GLB's
  // +X east / +Y up / -Z north convention into the viewer's east / north / up coordinates.
  function updateRailwayVisibility(y = year()) {
    let shown = 0, changed = false;
    for (const item of railwayItems) {
      const visible = item.from <= y && y <= item.to;
      if (item.group.visible !== visible) {
        item.group.visible = visible;
        changed = true;
      }
      if (visible) shown++;
    }
    railwayModelsShown = shown;
    if (changed) map.triggerRepaint();
  }

  function railwayAnchor(feature) {
    const p = feature.properties || {};
    const coords = feature.geometry?.type === 'Point' ? feature.geometry.coordinates : [];
    const lon = Number(p.model_lon != null ? p.model_lon : coords[0]);
    const lat = Number(p.model_lat != null ? p.model_lat : coords[1]);
    return Number.isFinite(lon) && Number.isFinite(lat) ? [lon, lat] : null;
  }

  // Build an elevation profile along a bridge's source centreline. Unlike ordinary
  // track, bridge vertices must follow the elevations at the two banks rather than
  // the LiDAR surface underneath the span.
  function makeBridgeElevationProfile(sourceFeature, anchorE, anchorN) {
    const geometry = sourceFeature?.geometry;
    const rawLines = geometry?.type === 'LineString' ? [geometry.coordinates]
      : geometry?.type === 'MultiLineString' ? geometry.coordinates : [];
    const paths = [];
    for (const line of rawLines) {
      const points = [];
      for (const coord of line || []) {
        if (!coord || !Number.isFinite(Number(coord[0])) || !Number.isFinite(Number(coord[1]))) continue;
        const [e, n] = frame.toLocal(Number(coord[0]), Number(coord[1]));
        const h = Number(heightAt(e, n));
        if (!Number.isFinite(h)) continue;
        const point = { e: e - anchorE, n: n - anchorN, h };
        if (!points.length || Math.hypot(point.e - points.at(-1).e, point.n - points.at(-1).n) > 0.05)
          points.push(point);
      }
      if (points.length >= 2) paths.push(points);
    }
    if (!paths.length) return null;
    const profile = { paths };
    profile.anchorHeight = sampleBridgeProfileHeight(profile, 0, 0);
    return Number.isFinite(profile.anchorHeight) ? profile : null;
  }
  function sampleBridgeProfileHeight(profile, e, n) {
    let bestD2 = Infinity, bestHeight = NaN;
    for (const points of profile?.paths || []) {
      for (let i = 0; i < points.length - 1; i++) {
        const a = points[i], b = points[i + 1];
        const dx = b.e - a.e, dn = b.n - a.n;
        const length2 = dx * dx + dn * dn;
        const t = length2 > 1e-9
          ? Math.max(0, Math.min(1, ((e - a.e) * dx + (n - a.n) * dn) / length2)) : 0;
        const qx = a.e + dx * t, qn = a.n + dn * t;
        const d2 = (e - qx) ** 2 + (n - qn) ** 2;
        if (d2 < bestD2) {
          bestD2 = d2;
          bestHeight = a.h + (b.h - a.h) * t;
        }
      }
    }
    return bestHeight;
  }

  // Ordinary railway is draped onto LiDAR. Bridge geometry instead follows a
  // bank-to-bank elevation profile, leaving the span above the ground/water below.
  function conformRailwaySceneToTerrain(sourceScene, anchorE, anchorN, anchorGround, bridgeProfile = null) {
    sourceScene.updateMatrixWorld(true);
    const rootInverse = sourceScene.matrixWorld.clone().invert();
    const localPoint = new THREE.Vector3();
    sourceScene.traverse(node => {
      if (!node.isMesh || !node.geometry?.attributes?.position) return;
      const geometry = node.geometry;
      const positions = geometry.attributes.position;
      const nodeToRoot = rootInverse.clone().multiply(node.matrixWorld);
      const rootToNode = nodeToRoot.clone().invert();
      for (let i = 0; i < positions.count; i++) {
        localPoint.fromBufferAttribute(positions, i).applyMatrix4(nodeToRoot);
        const terrain = bridgeProfile
          ? sampleBridgeProfileHeight(bridgeProfile, localPoint.x, -localPoint.z)
          : heightAt(anchorE + localPoint.x, anchorN - localPoint.z);
        if (Number.isFinite(terrain)) localPoint.y += terrain - anchorGround;
        localPoint.applyMatrix4(rootToNode);
        positions.setXYZ(i, localPoint.x, localPoint.y, localPoint.z);
      }
      positions.needsUpdate = true;
      geometry.computeBoundingBox();
      geometry.computeBoundingSphere();
    });
    sourceScene.updateMatrixWorld(true);
  }

  async function ensureRailwayModels() {
    if (!railwayModelsOn || !railwayCandidates.length || (!preloading && map.getZoom() < RAILWAY_MODEL_MIN_ZOOM - 0.4)) return;
    const y = year(), view = preloading ? AREA : paddedView(), centre = map.getCenter();
    const wanted = railwayCandidates.filter(f => {
      if (railwayState.has(f)) return false;
      const p = f.properties || {}, anchor = railwayAnchor(f);
      if (!anchor || !inBounds(anchor, view)) return false;
      const from = toYear(p.from_year) ?? -99999;
      const to = toYear(p.to_year) ?? 99999;
      return from <= y && y <= to;
    });
    if (!wanted.length) return;
    wanted.sort((a, b) => {
      const aa = railwayAnchor(a), bb = railwayAnchor(b);
      return (aa[0] - centre.lng) ** 2 + (aa[1] - centre.lat) ** 2
        - ((bb[0] - centre.lng) ** 2 + (bb[1] - centre.lat) ** 2);
    });
    wanted.forEach(f => railwayState.set(f, 'loading'));
    railwayModelsPending += wanted.length;

    try {
      await ensureTerrainReady();
      if (!hf) throw new Error('Terrain heightfield is unavailable');
    } catch (err) {
      wanted.forEach(f => railwayState.set(f, 'failed'));
      railwayModelsPending -= wanted.length;
      for (const f of wanted) railwayFailures.push({ id: f.properties?.id, message: err?.message || String(err) });
      console.warn('Terrain unavailable while placing railway meshes:', err);
      updateStatus();
      return;
    }

    let loader;
    try {
      gltfLoaderPromise ||= (async () => {
        const [{ GLTFLoader }, { DRACOLoader }, { MeshoptDecoder }] = await Promise.all([
          import('three/addons/loaders/GLTFLoader.js'),
          import('three/addons/loaders/DRACOLoader.js'),
          import('three/addons/libs/meshopt_decoder.module.js'),
        ]);
        return new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath(DRACO_PATH)).setMeshoptDecoder(MeshoptDecoder);
      })();
      loader = await gltfLoaderPromise;
    } catch (err) {
      wanted.forEach(f => railwayState.set(f, 'failed'));
      railwayModelsPending -= wanted.length;
      for (const f of wanted) railwayFailures.push({ id: f.properties?.id, message: err?.message || String(err) });
      console.warn('GLTFLoader unavailable for railway meshes:', err);
      updateStatus();
      return;
    }

    let next = 0;
    const worker = async () => {
      while (next < wanted.length) {
        const f = wanted[next++], p = f.properties || {}, url = railwayModelUrl(f);
        try {
          const gltf = await loader.loadAsync(url);
          const sourceScene = gltf.scene;
          const anchor = railwayAnchor(f);
          if (!anchor) throw new Error('Railway manifest has no valid model anchor');
          const [e, n] = frame.toLocal(anchor[0], anchor[1]);
          const sampledHeight = hf.sampleMerc(mercX(anchor[0]), mercY(anchor[1]));
          const terrainGround = Number.isFinite(sampledHeight) ? sampledHeight : 0;
          const manifestProps = f.properties || {};
          const bridgeSource = isBridgeValue(manifestProps.bridge)
            ? (manifestProps.src != null ? railFeatureBySource.get(String(manifestProps.src)) : null)
                || (manifestProps.id != null ? railFeatureById.get(String(manifestProps.id)) : null)
            : null;
          const bridgeProfile = bridgeSource ? makeBridgeElevationProfile(bridgeSource, e, n) : null;
          const ground = bridgeProfile ? bridgeProfile.anchorHeight : terrainGround;
          conformRailwaySceneToTerrain(sourceScene, e, n, ground, bridgeProfile);
          const dz = Number.isFinite(Number(p.model_dz)) ? Number(p.model_dz) : 0;
          const scaleValue = Number(p.model_scale);
          const scale = Number.isFinite(scaleValue) && scaleValue !== 0 ? scaleValue : 1;
          const rotationY = -(Number(p.model_rot) || 0) * Math.PI / 180;
          const modelTransform = new THREE.Matrix4().compose(
            new THREE.Vector3(0, 0, 0),
            new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rotationY, 0)),
            new THREE.Vector3(scale, scale, scale)
          );
          const placement = new THREE.Matrix4().makeTranslation(e, n, ground + dz).multiply(rotX).multiply(modelTransform);
          const holder = new THREE.Group();
          holder.name = `railway-${p.id ?? 'unknown'}`;
          holder.matrixAutoUpdate = false;
          holder.matrix.copy(placement);
          holder.add(sourceScene);
          const from = toYear(p.from_year) ?? -99999;
          const to = toYear(p.to_year) ?? 99999;
          holder.visible = from <= year() && year() <= to;
          railwayRoot.add(holder);
          railwayItems.push({ id: p.id, name: p.name, from, to, group: holder, props: p, url });
          railwayState.set(f, 'ok');
        } catch (err) {
          railwayState.set(f, 'failed');
          const detail = { id: p.id, path: p.model, url, message: err?.message || String(err) };
          railwayFailures.push(detail);
          console.warn(`Railway mesh failed for ${p.id} (${p.model}; resolved ${url}):`, err);
        }
        railwayModelsPending--;
      }
    };
    await Promise.all(Array.from({ length: Math.min(3, wanted.length) }, worker));
    updateRailwayVisibility();
    updateStatus();
    map.triggerRepaint();
  }

  // Border models are generated from borders.geojson into one GLB per line feature.
  // Each vertex is shifted to the LiDAR terrain, so hedges, walls, bushes and fences
  // follow local slopes instead of floating over hollows or cutting through ridges.
  function borderAnchor(feature) {
    const p = feature.properties || {};
    const coords = feature.geometry?.type === 'Point' ? feature.geometry.coordinates : [];
    const lon = Number(p.model_lon != null ? p.model_lon : coords[0]);
    const lat = Number(p.model_lat != null ? p.model_lat : coords[1]);
    return Number.isFinite(lon) && Number.isFinite(lat) ? [lon, lat] : null;
  }
  function conformBorderSceneToTerrain(sourceScene, anchorE, anchorN, anchorGround) {
    sourceScene.updateMatrixWorld(true);
    const rootInverse = sourceScene.matrixWorld.clone().invert();
    const localPoint = new THREE.Vector3();
    sourceScene.traverse(node => {
      if (!node.isMesh || !node.geometry?.attributes?.position) return;
      const geometry = node.geometry, positions = geometry.attributes.position;
      const nodeToRoot = rootInverse.clone().multiply(node.matrixWorld);
      const rootToNode = nodeToRoot.clone().invert();
      for (let i = 0; i < positions.count; i++) {
        localPoint.fromBufferAttribute(positions, i).applyMatrix4(nodeToRoot);
        const terrain = heightAt(anchorE + localPoint.x, anchorN - localPoint.z);
        if (Number.isFinite(terrain)) localPoint.y += terrain - anchorGround;
        localPoint.applyMatrix4(rootToNode);
        positions.setXYZ(i, localPoint.x, localPoint.y, localPoint.z);
      }
      positions.needsUpdate = true;
      geometry.computeVertexNormals();
      geometry.computeBoundingBox();
      geometry.computeBoundingSphere();
    });
    sourceScene.updateMatrixWorld(true);
  }
  function updateBorderVisibility(y = year()) {
    let shown = 0, changed = false;
    for (const item of borderItems) {
      const visible = item.from <= y && y <= item.to;
      if (item.group.visible !== visible) { item.group.visible = visible; changed = true; }
      if (visible) shown++;
    }
    borderModelsShown = shown;
    if (changed) map.triggerRepaint();
  }
  async function ensureBorderModels() {
    if (!borderModelsOn || !borderCandidates.length || (!preloading && map.getZoom() < BORDER_MODEL_MIN_ZOOM - 0.4)) return;
    const y = year(), view = preloading ? AREA : paddedView(), centre = map.getCenter();
    const wanted = borderCandidates.filter(f => {
      if (borderState.has(f)) return false;
      const p = f.properties || {}, anchor = borderAnchor(f);
      const from = p.from_year == null ? -99999 : Number(p.from_year), to = p.to_year == null ? 99999 : Number(p.to_year);
      if (!(from <= y && y <= to) || !anchor) return false;
      const b = p.model_bbox;
      const overlaps = Array.isArray(b) && b.length === 4
        ? b[0] <= view[2] && b[2] >= view[0] && b[1] <= view[3] && b[3] >= view[1]
        : anchor[0] >= view[0] && anchor[0] <= view[2] && anchor[1] >= view[1] && anchor[1] <= view[3];
      return overlaps;
    });
    if (!wanted.length) return;
    wanted.sort((a,b) => {
      const aa=borderAnchor(a), bb=borderAnchor(b);
      return (aa[0]-centre.lng)**2+(aa[1]-centre.lat)**2 - ((bb[0]-centre.lng)**2+(bb[1]-centre.lat)**2);
    });
    wanted.forEach(f => borderState.set(f,'loading'));
    borderModelsPending += wanted.length;
    try { await ensureTerrainReady(); if (!hf) throw new Error('Terrain heightfield is unavailable'); }
    catch (err) {
      wanted.forEach(f => { borderState.set(f,'failed'); borderFailures.push({id:f.properties?.id,message:err?.message||String(err)}); });
      borderModelsPending -= wanted.length; console.warn('Terrain unavailable while placing border models:',err); updateStatus(); return;
    }
    let loader;
    try {
      gltfLoaderPromise ||= (async () => {
        const [{ GLTFLoader }, { DRACOLoader }, { MeshoptDecoder }] = await Promise.all([
          import('three/addons/loaders/GLTFLoader.js'), import('three/addons/loaders/DRACOLoader.js'),
          import('three/addons/libs/meshopt_decoder.module.js')
        ]);
        return new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath(DRACO_PATH)).setMeshoptDecoder(MeshoptDecoder);
      })();
      loader = await gltfLoaderPromise;
    } catch (err) {
      wanted.forEach(f => { borderState.set(f,'failed'); borderFailures.push({id:f.properties?.id,message:err?.message||String(err)}); });
      borderModelsPending -= wanted.length; console.warn('GLTFLoader unavailable for border models:',err); updateStatus(); return;
    }
    let next = 0;
    const worker = async () => {
      while (next < wanted.length) {
        const f = wanted[next++], p = f.properties || {}, url = borderModelUrl(f);
        try {
          const gltf = await loader.loadAsync(url), sourceScene = gltf.scene;
          const anchor = borderAnchor(f); if (!anchor) throw new Error('Border manifest has no valid model anchor');
          const [e,n] = frame.toLocal(anchor[0],anchor[1]);
          const sampled = hf.sampleMerc(mercX(anchor[0]),mercY(anchor[1]));
          const ground = Number.isFinite(sampled) ? sampled : 0;
          conformBorderSceneToTerrain(sourceScene,e,n,ground);
          const scaleValue=Number(p.model_scale), scale=Number.isFinite(scaleValue)&&scaleValue!==0?scaleValue:1;
          const rotationY=-(Number(p.model_rot)||0)*Math.PI/180;
          const transform=new THREE.Matrix4().compose(new THREE.Vector3(),new THREE.Quaternion().setFromEuler(new THREE.Euler(0,rotationY,0)),new THREE.Vector3(scale,scale,scale));
          const dz=Number.isFinite(Number(p.model_dz))?Number(p.model_dz):0;
          const placement=new THREE.Matrix4().makeTranslation(e,n,ground+dz).multiply(rotX).multiply(transform);
          const holder=new THREE.Group(); holder.name=`border-${p.kind||'unknown'}-${p.id??'unknown'}`;
          holder.matrixAutoUpdate=false; holder.matrix.copy(placement); holder.add(sourceScene);
          const from=p.from_year==null?-99999:Number(p.from_year), to=p.to_year==null?99999:Number(p.to_year);
          holder.visible=from<=year()&&year()<=to; borderRoot.add(holder);
          borderItems.push({id:p.id,name:p.name,kind:p.kind,from,to,group:holder,props:p,url}); borderState.set(f,'ok');
        } catch(err) {
          borderState.set(f,'failed'); const detail={id:p.id,kind:p.kind,path:p.model,url,message:err?.message||String(err)};
          borderFailures.push(detail); console.warn(`Border model failed for ${p.id} (${p.model}; resolved ${url}):`,err);
        }
        borderModelsPending--;
      }
    };
    await Promise.all(Array.from({length:Math.min(4,wanted.length)},worker));
    updateBorderVisibility(); updateStatus(); map.triggerRepaint();
  }

  // Fetch visible-in-time models lazily, but wait for the LiDAR heightfield before baking their matrices.
  async function ensureModels() {
    if (!modelCandidates.length || (!preloading && map.getZoom() < TIER.modelMinZoom - 0.5)) return;
    const y = year(), view = preloading ? AREA : paddedView(), cen = map.getCenter();
    const wanted = modelCandidates.filter(f => {
      if (modelState.has(f)) return false;
      const p = f.properties;
      const from = p.from_year == null ? MODERN_FROM : Number(p.from_year);
      const to = p.to_year == null ? 99999 : Number(p.to_year);
      return from <= y && y <= to && inBounds(centroid(f.geometry), view);
    });
    if (!wanted.length) return;
    const d2 = f => { const [x, yy] = centroid(f.geometry); return (x - cen.lng) ** 2 + (yy - cen.lat) ** 2; };
    wanted.sort((a, b) => d2(a) - d2(b));

    // Reserve the features BEFORE awaiting terrain or loader setup. Timeline scrubbing and
    // map moveend can both call ensureModels while those promises are pending; reserving here
    // prevents the same feature from being queued twice and overflowing its BatchedMesh.
    wanted.forEach(f => modelState.set(f, 'loading'));
    modelsPending += wanted.length;
    try {
      await ensureTerrainReady();
      if (!hf) throw new Error('Terrain heightfield is unavailable');
    } catch (err) {
      wanted.forEach(f => modelState.set(f, 'failed'));
      modelFailed += wanted.length;
      modelsPending -= wanted.length;
      console.warn('Terrain was unavailable while placing building models:', err);
      updateStatus();
      return;
    }

    let loader;
    try {
      gltfLoaderPromise ||= (async () => {
        const [{ GLTFLoader }, { DRACOLoader }, { MeshoptDecoder }] = await Promise.all([
          import('three/addons/loaders/GLTFLoader.js'),
          import('three/addons/loaders/DRACOLoader.js'),
          import('three/addons/libs/meshopt_decoder.module.js'),
        ]);
        return new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath(DRACO_PATH)).setMeshoptDecoder(MeshoptDecoder);
      })();
      loader = await gltfLoaderPromise;
    } catch (err) {
      console.warn('GLTFLoader could not be loaded; keeping the extruded boxes:', err);
      wanted.forEach(f => modelState.set(f, 'failed'));
      modelFailed += wanted.length; modelsPending -= wanted.length; updateStatus();
      return;
    }
    const flush = () => {
      for (const batch of modelBatches) { batch.computeBoundingBox(); batch.computeBoundingSphere(); }
      updateModelVisibility(); syncBuildingFootprints(); updateStatus();
    };
    const loadScene = url => {
      let promise = modelCache.get(url);
      if (!promise) modelCache.set(url, promise = loader.loadAsync(url).then(g => g.scene));
      return promise;
    };
    let next = 0, sinceFlush = 0;
    const worker = async () => {
      while (next < wanted.length) {
        const f = wanted[next++], p = f.properties, url = modelUrl(f);
        let sourceScene = null, item = null;
        try {
          sourceScene = await loadScene(url);
          scanWindowMaterialsInScene(sourceScene, url);
          let template;
          try {
            template = await getModelTemplate(url, sourceScene);
          } catch (templateError) {
            // A model-specific geometry/material layout can fail while preparing its batch.
            // Remove any empty batches created by that attempt, then render this GLB normally.
            for (const batch of [...modelBatches]) {
              if (batch.userData.modelUrl !== url) continue;
              modelRoot.remove(batch);
              modelBatches.delete(batch);
              batch.dispose();
            }
            template = { entries: [], rootPosition: sourceScene.position.clone(), rootRotation: sourceScene.rotation.clone(),
              fallbackReason: `BatchedMesh template creation failed: ${templateError.message || templateError}` };
          }
          const ll = centroid(f.geometry), [e, n] = frame.toLocal(ll[0], ll[1]);
          const sampledHeight = hf.sampleMerc(mercX(ll[0]), mercY(ll[1]));
          item = { id: p.id, lngLat: ll, e, n, z: Number.isFinite(sampledHeight) ? sampledHeight : 0,
            dz: Number(p.model_dz) || 0,
            scale: Number(p.model_scale) || 1,
            rotationY: -(Number(p.model_rot) || 0) * Math.PI / 180,
            rootPosition: template.rootPosition,
            rootRotation: template.rootRotation,
            from: p.from_year == null ? MODERN_FROM : Number(p.from_year),
            to: p.to_year == null ? 99999 : Number(p.to_year),
            visible: false, props: p, instances: [], fallbackObject: null, chimneyPoints: [], smokeParticleRanges: [],
            lightPoints: [], lampLightGroup: null };

          if (template.fallbackReason || !template.entries.length) {
            addStandaloneModel(item, sourceScene, template.fallbackReason || 'GLB contains no batchable mesh geometry');
          } else {
            try {
              for (const entry of template.entries) {
                // In r160 addGeometry() creates a separately addressable BatchedMesh entry;
                // its returned ID is used by setMatrixAt(), setVisibleAt(), and raycast batchId.
                const batchId = entry.batch.addGeometry(entry.geometry);
                const ref = { batch: entry.batch, batchId, meshMatrix: entry.meshMatrix };
                item.instances.push(ref);
                entry.batch.userData.itemsByBatchId.set(batchId, item);
                entry.batch.setVisibleAt(batchId, false);
              }
              setModelMatrix(item);
            } catch (batchError) {
              discardPartialBatchEntries(item);
              addStandaloneModel(item, sourceScene, `BatchedMesh rejected this GLB: ${batchError.message || batchError}`);
            }
          }
          modelItems.push(item);
          modelIds.push(p.id);
          modelState.set(f, 'ok'); modelOk++;
          const markerUrl = chimneyModelUrl(f);
          if (markerUrl) loadChimneyMarkerPoints(markerUrl, loader).then(points => {
            if (!points.length) return;
            const buildingTransform = modelBaseMatrix(item);
            item.chimneyPoints = points.map(point => point.clone().applyMatrix4(buildingTransform));
            scheduleSmokeRebuild();
          });
          const lightsUrl = lightMarkerModelUrl(f);
          if (lightsUrl) loadLightMarkerPoints(lightsUrl, loader).then(points => {
            if (!points.length) return;
            console.info(`Loaded ${points.length} lamp marker(s) for building ${item.id}`);
            createLampLights(item, points);
          });
        } catch (err) {
          modelState.set(f, 'failed'); modelFailed++;
          const detail = { id: p.id, path: p.model, url, message: err?.message || String(err) };
          modelFailureDetails.push(detail);
          console.warn(`Model failed for ${p.id} (${p.model}; resolved ${url}); keeping the extruded box:`, err);
        }
        modelsPending--;
        if (++sinceFlush % 25 === 0) flush();
      }
    };
    await Promise.all(Array.from({ length: Math.min(MODEL_CONCURRENCY, wanted.length) }, worker));
    for (const batch of modelBatches) { batch.computeBoundingBox(); batch.computeBoundingSphere(); }
    flush();
  }

  // ============================================================ date filtering
  let lastApplyMs = 0;

  // Flat footprints are only needed where there is no detailed GLB on screen: buildings without a model always
  // keep theirs, and a model's footprint is hidden once the camera is close enough for its GLB to be drawn
  // (and the GLB has loaded, so a missing or failed model still leaves its footprint).
  let footprintKey = '';
  function syncBuildingFootprints(y = year()) {
    if (!map.getLayer('master-footprints')) return;
    const hide = map.getZoom() >= TIER.modelMinZoom ? modelIds : [];
    const key = `${y}|${hide.length}`;
    if (key === footprintKey) return;
    footprintKey = key;
    const dateFilter = buildingDateF(y);
    map.setFilter('master-footprints', hide.length
      ? ['all', ...dateFilter, ['!', ['in', ['get', 'id'], ['literal', hide]]]]
      : ['all', ...dateFilter], { validate: false });
  }

  // Each source is re-filtered only when the year crosses one of its own change points.
  function applyFilters(force) {
    const y = year();
    const s = { base: slotOf(basePts, y), roads: slotOf(roadPts, y), forests: slotOf(forestPts, y), buildings: slotOf(buildingPts, y) };
    if (force || s.roads !== slots.roads) {
      const roadFilters = roadAreaFilters(y);
      ROAD_AREA_LAYERS.forEach(d => map.getLayer(d.id) && map.setFilter(d.id, roadFilters[d.filterKey], { validate: false }));
    }
    if (force || s.base !== slots.base) {
      const df = dateF(y);
      baseDefs.forEach(d => map.getLayer(d.id) && map.setFilter(d.id, ['all', d.kf, ...df], { validate: false }));
      if (map.getLayer('urban-ground')) map.setFilter('urban-ground', ['all', ['==', ['get', 'kind'], 'urban'], ...df], { validate: false });
      if (map.getLayer('grass-texture')) map.setFilter('grass-texture', ['all', K('green'), ['!', ['in', ['get', 'cls'], ['literal', NO_GRASS_TEXTURE]]], ...df], { validate: false });
    }
    if (force || s.forests !== slots.forests) {
      // forests: same rule as buildings. (The trees themselves are filtered on the GPU by Uni.uYear.)
      if (map.getLayer('forest-floor')) map.setFilter('forest-floor', ['all', ...forestDateF(y)], { validate: false });
      if (map.getLayer('forest-litter')) map.setFilter('forest-litter', ['all', ...forestDateF(y), ['!=', ['get', 'tree_type'], 'conifer']], { validate: false });
      if (map.getLayer('forest-needles')) map.setFilter('forest-needles', ['all', ...forestDateF(y), ['==', ['get', 'tree_type'], 'conifer']], { validate: false });
    }
    if (force || s.buildings !== slots.buildings) {
      syncBuildingFootprints(y);
      updateModelVisibility();
    }
    Object.assign(slots, s);
  }

  // ============================================================ historic maps
  let lastActiveMapsText = null;
  function updateHistoricMaps() {
    const y = year(), active = [];
    histMaps.forEach(m => {
      const on = m.from_year <= y && y <= m.to_year;
      if (m._visible !== on) {
        map.setLayoutProperty(m.layerId, 'visibility', on ? 'visible' : 'none');
        m._visible = on;
      }
      if (on) active.push(m.name || m.tiles);
    });
    const label = histMaps.length
      ? (active.length ? 'Map: ' + active.join('; ') : 'No historic map for this year') : '';
    if (label !== lastActiveMapsText) {
      $('activeMaps').textContent = label;
      lastActiveMapsText = label;
    }
  }
  $('mapOpacity').addEventListener('input', e =>
    histMaps.forEach(m => map.setPaintProperty(m.layerId, 'raster-opacity', parseFloat(e.target.value))));

  // ============================================================ annual year slider
  // While scrubbing, apply the current year at a capped cadence. This keeps the map visibly
  // developing beneath the slider without making every pointer event rebuild MapLibre filters.
  // applyFilters() still touches each source only when its precomputed change-point slot changes.
  function onYearChange(force = false) {
    const t0 = performance.now();
    updateTimelineLabel();
    Uni.uYear.value = year();
    const buildingsChanged = force || slotOf(buildingPts, year()) !== slots.buildings;
    if (map.getLayer('urban-ground')) {
      const us = slotOf(urbanHardPts, year());
      if (force || us !== urbanSlot) {
        urbanSlot = us;
        map.setPaintProperty('urban-ground', 'fill-color', urbanGroundColour(year()), { validate: false });
        map.setPaintProperty('urban-ground', 'fill-outline-color', urbanGroundOutline(year()), { validate: false });
      }
    }
    applyFilters(force);
    updateRailwayVisibility();
    ensureRailwayModels();
    updateBorderVisibility();
    ensureBorderModels();
    for (let i = activeTrains.length - 1; i >= 0; i--) {
      const route = activeTrains[i].route;
      if (year() < route.from || year() > route.to) removeActiveTrain(i);
    }
    ensureTrainTraffic();
    updateHistoricMaps();
    renderEvents();
    // Model candidates are scanned only when a building visibility boundary is crossed.
    // Camera movement has its own moveend hook, so ordinary years do not rescan all models.
    if (buildingsChanged) ensureModels();
    map.triggerRepaint();
    lastApplyMs = performance.now() - t0;
  }

  const SCRUB_APPLY_MS = 110;
  let lastScrubApply = 0, scrubTimer = null;
  function scrubTimeline() {
    updateTimelineLabel();                         // the numeric label remains immediate
    const now = performance.now();
    const wait = Math.min(400, Math.max(SCRUB_APPLY_MS, 2 * lastApplyMs)) - (now - lastScrubApply);   // back off if updates are slow
    if (wait <= 0) {
      clearTimeout(scrubTimer); scrubTimer = null;
      lastScrubApply = now;
      onYearChange(false);
    } else if (scrubTimer === null) {
      scrubTimer = setTimeout(() => {
        scrubTimer = null;
        lastScrubApply = performance.now();
        onYearChange(false);
      }, wait);
    }
  }
  slider.addEventListener('input', scrubTimeline);
  slider.addEventListener('change', () => {
    clearTimeout(scrubTimer); scrubTimer = null;
    lastScrubApply = performance.now();
    onYearChange(false);                           // always commit the exact final year
  });

  let timelineTimer = null;
  const playButton = $('playTimeline');
  const speedSelect = $('timelineSpeed');
  const advanceTimeline = () => {
    const next = timelineIndex() >= Number(slider.max) ? Number(slider.min) : timelineIndex() + 1;
    slider.value = String(next);
    onYearChange(false);
  };
  const scheduleTimeline = () => {
    if (timelineTimer !== null) clearInterval(timelineTimer);
    timelineTimer = setInterval(advanceTimeline, Number(speedSelect.value));
  };
  const stopTimeline = () => {
    if (timelineTimer !== null) clearInterval(timelineTimer);
    timelineTimer = null;
    playButton.textContent = '▶ Play';
    playButton.setAttribute('aria-label', 'Play timeline');
  };
  playButton.addEventListener('click', () => {
    if (timelineTimer !== null) { stopTimeline(); return; }
    playButton.textContent = 'Ⅱ Pause';
    playButton.setAttribute('aria-label', 'Pause timeline');
    scheduleTimeline();
  });
  speedSelect.addEventListener('change', () => {
    if (timelineTimer !== null) scheduleTimeline();
  });
  // ============================================================ toggles
  function applyNightMode(enabled = $('nightMode').checked) {
    ambientLight.intensity = enabled ? AMBIENT_NIGHT_INTENSITY : AMBIENT_DAY_INTENSITY;
    sunLight.intensity = enabled ? SUN_NIGHT_INTENSITY : SUN_DAY_INTENSITY;
    updateWindowGlowMaterials(enabled);
    updateLampLightVisibility();
    // These custom ShaderMaterials do not receive Three.js lights, so share the mode as a uniform.
    Uni.uNightMix.value = enabled ? 1 : 0;
    // The terrain, hillshade and draped ground textures are MapLibre layers, not Three.js meshes;
    // darken them with a translucent polygon under the custom Three.js scene layer.
    if (map.isStyleLoaded() && map.getLayer('night-landscape-dimmer')) {
      map.setPaintProperty('night-landscape-dimmer', 'fill-opacity', enabled ? NIGHT_LANDSCAPE_OPACITY : 0);
    }
    map.triggerRepaint();
  }
  $('nightMode').addEventListener('change', e => applyNightMode(e.target.checked));
  $('bldVis').addEventListener('change', e => {
    buildingModelsVisible = e.target.checked;
    const v = buildingModelsVisible ? 'visible' : 'none';
    ['master-footprints'].forEach(id => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', v));
    updateLampLightVisibility();
    syncAnim();
    map.triggerRepaint();
  });
  $('smokeVis').addEventListener('change', e => {
    smokeOn = e.target.checked;
    syncAnim();
    map.triggerRepaint();
  });
  $('texVis').addEventListener('change', e => {
    const v = e.target.checked ? 'visible' : 'none';
    ['grass-texture', 'forest-litter', 'forest-needles'].forEach(id => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', v));
  });
  // A missing image can still be generated immediately, but the complete 4-state set is
  // also prepared in idle slices after the first map frame (rather than during timeline input).
  map.on('styleimagemissing', e => {
    const m = /^tex:(grass|litter|needles):(spring|summer|autumn|winter)$/.exec(e.id);
    if (m && !map.hasImage(e.id)) map.addImage(e.id, drawPattern(m[1], m[2]), { pixelRatio: 1 });
    const r = /^road:(earth|mud|gravel|cobble|asphalt|ballast):(spring|summer|autumn|winter)$/.exec(e.id);
    if (r && !map.hasImage(e.id)) map.addImage(e.id, drawRoadPattern(r[1], r[2]), { pixelRatio: 1 });
  });
  $('treeVis').addEventListener('change', e => { treesOn = e.target.checked; map.triggerRepaint(); });
  $('waterVis').addEventListener('change', e => { waterOn = e.target.checked; syncAnim(); map.triggerRepaint(); });
  $('boatVis').addEventListener('change', e => { boatsOn = e.target.checked; syncAnim(); map.triggerRepaint(); });
  $('birdVis').addEventListener('change', e => { birdsOn = e.target.checked; syncAnim(); map.triggerRepaint(); });
  $('mistVis').addEventListener('change', e => { mistOn = e.target.checked; syncAnim(); map.triggerRepaint(); });
  $('roadAreasVis').addEventListener('change', () => {
    const v = $('roadAreasVis').checked ? 'visible' : 'none';
    ROAD_AREA_LAYERS.forEach(d => map.getLayer(d.id) && map.setLayoutProperty(d.id, 'visibility', v));
  });
  $('urbanGroundVis').addEventListener('change', e => {
    if (map.getLayer('urban-ground')) map.setLayoutProperty('urban-ground', 'visibility', e.target.checked ? 'visible' : 'none');
  });
  $('railModelsVis').addEventListener('change', e => {
    railwayModelsOn = e.target.checked;
    updateRailwayVisibility();
    ensureRailwayModels();
    map.triggerRepaint();
  });
  $('borderVis').addEventListener('change', e => {
    borderModelsOn = e.target.checked;
    updateBorderVisibility();
    ensureBorderModels();
    map.triggerRepaint();
  });
  $('trainTrafficVis').addEventListener('change', e => setTrainTrafficEnabled(e.target.checked));
  let mistTimer = null;
  $('mistHeight').addEventListener('input', e => {
    $('mistHeightValue').textContent = `${e.target.value} m`;
    clearTimeout(mistTimer);
    mistTimer = setTimeout(() => stats.built && rebuildMist(), 120);
  });
  $('quality').value = new URLSearchParams(location.search).get('quality') in TIERS ? new URLSearchParams(location.search).get('quality') : 'auto';
  $('quality').addEventListener('change', e => {
    const p = new URLSearchParams(location.search);
    if (e.target.value === 'auto') p.delete('quality'); else p.set('quality', e.target.value);
    location.search = p.toString();                   // the quality tier is applied at startup
  });

  // ============================================================ Dates of Interest
  const eventList = (eventsCfg.events || [])
    .filter(e => e.title && e.from_year != null && Number.isFinite(Number(e.from_year)))
    .map((e, i) => ({ ...e, _i: i,
      fromDate: Number(e.from_year),
      toDate: Number(e.to_year ?? e.from_year),
      to: e.to_year ?? e.from_year }))
    .sort((a, b) => a.fromDate - b.fromDate || String(a.title).localeCompare(String(b.title)));

  const evPanel = $('events'), evToggle = $('eventsToggle'), evContent = $('eventsContent');
  $('eventsHeading').textContent = `Dates of Interest${eventList.length ? ` (${eventList.length})` : ''}`;
  if (!eventList.length) {
    evContent.innerHTML = '<div class="ev-none">No dated events were found in events.json.</div>';
  } else {
    const monthName = month => new Date(Date.UTC(2000, month - 1, 1)).toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' });
    const eventDateLabel = e => e.from_month != null ? `${monthName(Number(e.from_month) || 1)} ${e.from_year}` : String(e.from_year);
    eventList.forEach(e => {
      const d = document.createElement('div');
      d.className = 'ev';
      d._dateOfInterest = e;
      const jump = document.createElement('button');
      jump.type = 'button';
      jump.className = 'ev-jump';
      jump.textContent = `${eventDateLabel(e)} — ${e.title}`;
      jump.title = `Go to ${e.from_year} on the timeline`;
      jump.addEventListener('click', () => {
        const targetYear = Math.max(Number(slider.min), Math.min(Number(slider.max), Math.floor(e.fromDate)));
        slider.value = String(targetYear);
        onYearChange(false);
      });
      d.append(jump);
      if (e.to_year != null && Number(e.to_year) !== Number(e.from_year)) {
        const range = document.createElement('small');
        range.textContent = `${e.from_year}–${e.to_year}`;
        d.append(range);
      }
      if (e.text) { const t = document.createElement('div'); t.textContent = e.text; d.append(t); }
      if (e.image) {
        const img = document.createElement('img');
        img.src = e.image; img.alt = e.image_caption || e.title; img.loading = 'lazy';
        img.onerror = () => img.remove();
        d.append(img);
        if (e.image_caption) { const c = document.createElement('small'); c.textContent = e.image_caption; d.append(c); }
      }
      if (e.lon != null && e.lat != null && inBounds([e.lon, e.lat], AREA)) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = 'Show on map';
        b.onclick = () => map.flyTo({ center: [e.lon, e.lat], zoom: e.zoom ?? 16.5, pitch: 55, duration: 2500 });
        d.append(b);
      }
      evContent.append(d);
    });
  }
  function renderEvents() {
    const y = year();
    for (const row of evContent.querySelectorAll('.ev')) {
      const e = row._dateOfInterest;
      if (e) row.classList.toggle('current', e.fromDate <= y && y <= e.toDate);
    }
  }

  function bindDisclosure(toggle, content) {
    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      content.hidden = expanded;
    });
  }
  bindDisclosure($('infoToggle'), $('infoContent'));
  bindDisclosure(evToggle, evContent);
  // ============================================================ default view + idle reset
  let HOME = null, idleTimer = null, popup = null, lastIdleReset = 0;

  // ---- attract loop (visitor mode): steps through the Dates of Interest while nobody is using the screen
  let attractTimer = null, attractActive = false, attractIdx = 0;
  const attractCaption = document.createElement('div');
  attractCaption.id = 'attractCaption'; attractCaption.hidden = true;
  document.body.append(attractCaption);
  const attractYears = () => {
    const lo = Number(slider.min), hi = Number(slider.max);
    const ys = [...new Set(eventList.map(e => Math.floor(e.fromDate)).filter(y => y >= lo && y <= hi))].sort((a, b) => a - b);
    if (ys.length >= 3) return ys;
    const out = [], step = Math.ceil((hi - lo) / 40);
    for (let y = lo; y < hi; y += step) out.push(y);
    return [...out, hi];
  };
  function attractStep() {
    const ys = attractYears();
    if (attractIdx >= ys.length) attractIdx = 0;
    const y = ys[attractIdx++];
    slider.value = String(y); updateTimelineLabel(); onYearChange(false);
    const evs = eventList.filter(e => Math.floor(e.fromDate) === y);
    attractCaption.innerHTML = `<b>${y}</b>${evs.length ? ' \u2014 ' + esc(evs.map(e => e.title).join(' \u00b7 ')) : ''}<small>Touch the screen to explore</small>`;
    attractCaption.hidden = false;
    const at = evs.find(e => e.lon != null && e.lat != null && inBounds([e.lon, e.lat], AREA));
    if (at) map.flyTo({ center: [at.lon, at.lat], zoom: at.zoom ?? 16.5, pitch: 55, duration: 2500 });
  }
  function startAttract() {
    if (!ATTRACT_ENABLED || CURATOR || attractActive) return;
    stopTimeline(); attractActive = true; attractIdx = 0;
    attractStep(); attractTimer = setInterval(attractStep, ATTRACT_DWELL_MS);
  }
  function stopAttract() {
    if (!attractActive) return;
    attractActive = false; clearInterval(attractTimer); attractTimer = null; attractCaption.hidden = true;
  }

  function goHome() {
    if (CURATOR) return;                                         // never reset under a curator who is editing
    if (popup) { popup.remove(); popup = null; }
    stopTimeline(); stopAttract();
    if (HOME) map.flyTo({ ...HOME, duration: 4000, essential: true });
    if (IDLE_RESETS_YEAR) { slider.value = String(DEFAULT_YEAR); updateTimelineLabel(); onYearChange(true); }
    startAttract();
  }
  function resetIdle() {
    if (attractActive) stopAttract();
    const now = performance.now();
    if (idleTimer && now - lastIdleReset < 250) return;           // pointermove fires very often
    lastIdleReset = now;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(goHome, IDLE_MS);
    if (idleCap !== Infinity) { idleCap = Infinity; syncAnim(); }
    clearTimeout(throttleTimer);
    const throttleWhenIdle = () => {
      if (timelineTimer !== null || attractActive) { throttleTimer = setTimeout(throttleWhenIdle, IDLE_THROTTLE_MS); return; }   // not while the timeline is playing
      idleCap = IDLE_ANIM_FPS; syncAnim();
    };
    throttleTimer = setTimeout(throttleWhenIdle, IDLE_THROTTLE_MS);
  }
  ['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, resetIdle, { passive: true }));
  setTimeout(() => { try { resetIdle(); } catch (err) { console.warn(err); } }, 3000);   // arm the idle timer even if nobody ever touches the screen

  // ============================================================ popups / picking
  const PICK = ['master-footprints'];
  const BASE_PICK = ['base-water', 'base-river', 'base-stream', 'urban-ground', 'base-green', 'base-wood'];
  const row = (k, v) => v === undefined || v === null || v === '' || v === 'null' ? '' : `<div><b>${esc(k)}</b> ${esc(v)}</div>`;

  // Notes may be inline text or a path to a text file. Loading never throws: a bad file just means no note.
  const noteCache = new Map();
  async function noteText(raw) {
    if (raw == null || raw === '' || raw === 'null') return null;
    raw = String(raw);
    if (!(/^\S+$/.test(raw) && /[\/.]/.test(raw))) return raw;           // inline text
    if (!CURATOR && noteCache.has(raw)) return noteCache.get(raw);
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(raw, { signal: ctl.signal, cache: CURATOR ? 'no-store' : 'default' });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = (await r.text()).trim() || null;
      noteCache.set(raw, text);
      return text;
    } catch (err) { console.warn('Could not load note', raw, err); return null; }
  }
  const dateLabel = p => {
    const f = toYear(p.from_year), t = toYear(p.to_year);
    if (f == null && t == null) return 'Throughout the timeline';
    if (f == null) return `Until ${t}`;
    if (t == null) return `${f} \u2013 present`;
    return f === t ? String(f) : `${f} \u2013 ${t}`;
  };
  const years = p => row('years', `${p.from_year ?? '(none)'} \u2013 ${p.to_year ?? '(none)'}`);

  // Visitors: name, dates, note. Curators: every stored property plus data-quality flags.
  const visitorHtml = async (fallback, p) => {
    const note = await noteText(p.notes);
    return `<div class="pu"><h3>${esc(p.name || fallback)}</h3><div class="pu-dates">${esc(dateLabel(p))}</div>${note ? `<p class="pu-note">${esc(note)}</p>` : ''}</div>`;
  };
  const curatorHtml = async (title, p) => {
    const note = await noteText(p.notes);
    const SKIP = new Set(['notes', 'from_year', 'to_year']);
    const keys = Object.keys(p).filter(k => !k.startsWith('_') && !SKIP.has(k)).sort((a, b) => ['id', 'name'].indexOf(b) - ['id', 'name'].indexOf(a));
    const fields = keys.map(k => row(k, typeof p[k] === 'object' && p[k] !== null ? JSON.stringify(p[k]) : p[k])).join('');
    const flags = [
      toYear(p.from_year) == null && 'No start year: shown from the start of the timeline',
      toYear(p.to_year) == null && 'No end year: shown up to the present',
      !p.name && 'No name',
      !p.src && !p.date_src && 'No source recorded',
      p.notes && note == null ? `Note could not be loaded (${p.notes})` : (!p.notes && 'No note'),
    ].filter(Boolean).map(m => `<div class="pu-flag">\u26a0 ${esc(m)}</div>`).join('');
    return `<b>${esc(title)}</b>${years(p)}${fields}${row('notes', note)}${flags}`;
  };
  const popupHtml = (title, p) => CURATOR ? curatorHtml(title, p) : visitorHtml(title, p);
  function showPopup(lngLat, html) {
    if (popup) popup.remove();
    popup = new maplibregl.Popup({ maxWidth: CURATOR ? '340px' : '420px', className: CURATOR ? 'popup-curator' : 'popup-visitor' })
      .setLngLat(lngLat).setHTML(html).addTo(map);
  }

  // Click-picking for railway and border meshes (buildings use pickModel above).
  const shownInScene = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
  function pickItems(pt, items) {
    const live = items.filter(it => it.group && shownInScene(it.group));
    if (!live.length) return null;
    const cv = map.getCanvas();
    const nx = (pt.x / cv.clientWidth) * 2 - 1, ny = 1 - (pt.y / cv.clientHeight) * 2;
    _inv.fromArray(lastMatrix).multiply(localToMerc).invert();
    _ra.set(nx, ny, -1).applyMatrix4(_inv);
    _rb.set(nx, ny, 1).applyMatrix4(_inv);
    raycaster.ray.origin.copy(_ra);
    raycaster.ray.direction.copy(_rb).sub(_ra).normalize();
    const hit = raycaster.intersectObjects(live.map(it => it.group), true)[0];
    if (!hit) return null;
    for (let o = hit.object; o; o = o.parent) { const it = live.find(x => x.group === o); if (it) return it; }
    return null;
  }

  map.on('click', async e => {
    try {
      if (haveMatrix && modelsShown && modelRoot.visible) {         // 1. 3D buildings
        const hit = pickModel(e.point);
        if (hit) { showPopup(e.lngLat, await popupHtml('Building', hit.props)); return; }
      }
      if (haveMatrix) {                                             // 2. railway + border meshes
        const rail = pickItems(e.point, railwayItems);
        if (rail) { showPopup(e.lngLat, await popupHtml('Railway', rail.props)); return; }
        const border = pickItems(e.point, borderItems);
        if (border) { showPopup(e.lngLat, await popupHtml('Wall, hedge or fence', border.props)); return; }
      }
      const f = map.queryRenderedFeatures(e.point, { layers: PICK.filter(id => map.getLayer(id)) })[0];   // 3. building footprints
      if (f) { showPopup(e.lngLat, await popupHtml('Building', f.properties)); return; }
      if (map.getLayer('forest-floor')) {                           // 4. forests
        const ff = map.queryRenderedFeatures(e.point, { layers: ['forest-floor'] })[0];
        if (ff) { showPopup(e.lngLat, await popupHtml('Woodland', ff.properties)); return; }
      }
      const road = map.queryRenderedFeatures(e.point, { layers: ROAD_AREA_LAYER_IDS.filter(id => map.getLayer(id)) })[0];   // 5. roads
      if (road) { showPopup(e.lngLat, await popupHtml('Road or route', road.properties)); return; }
      const base = map.queryRenderedFeatures(e.point, { layers: BASE_PICK.filter(id => map.getLayer(id)) })[0];   // 6. water, ground, green
      if (base && (CURATOR || base.properties.name || base.properties.notes)) showPopup(e.lngLat, await popupHtml('Landscape feature', base.properties));
    } catch (err) {
      console.warn('Click handler failed', err);
      showPopup(e.lngLat, '<div class="pu"><p class="pu-note">Sorry, the details for this feature could not be loaded.</p></div>');
    }
  });

  // hover cursor: at most ~10 queries per second, only when no button is held and the map is still
  let hoverPoint = null, hoverTimer = 0, lastHover = 0;
  map.on('mousemove', e => {
    if (e.originalEvent.buttons) return;
    hoverPoint = e.point;
    if (hoverTimer) return;
    hoverTimer = setTimeout(() => {
      hoverTimer = 0; lastHover = performance.now();
      if (map.isMoving()) return;
      const layers = [...PICK, 'forest-floor', ...ROAD_AREA_LAYER_IDS].filter(id => map.getLayer(id));
      map.getCanvas().style.cursor = layers.length && map.queryRenderedFeatures(hoverPoint, { layers }).length ? 'pointer' : '';
    }, Math.max(0, 100 - (performance.now() - lastHover)));
  });

  map.on('error', e => console.warn('Map error:', e && e.error && e.error.message));

  // ============================================================ status + performance readout
  function updateStatus() {
    statusEl.textContent = (textureSummary() ? textureSummary() + '. ' : '') +
      `Terrain: ${demMeta ? `LiDAR DTM (z${demMeta.minzoom}–${demMax})` : 'global DEM (~10–30 m)'}. ` +
      `${base.features.length} base features, ${urbanGroundFeatures.length} urban ground polygon(s). ` +
      `${borders.features.length} border line(s) (${borderModels.length} generated model manifest entries, ${borderItems.length} loaded${borderModelsPending ? `, ${borderModelsPending} loading` : ''}${borderFailures.length ? `, ${borderFailures.length} failed` : ''}). ` +
      (master ? `${master.features.length} buildings` +
        (modelOk || modelFailed ? ` (${modelOk} detailed model${modelOk === 1 ? '' : 's'}${modelFallbackCount ? `, ${modelFallbackCount} standalone fallback` : ''}${modelFailed ? `, ${modelFailed} failed` : ''}). ` : '. ')
        : 'No buildings file. ') +
      (forests.features.length
        ? `${forests.features.length} forests` + (stats.built ? ` (${stats.trees.toLocaleString()} trees${stats.thin < 1 ? ', thinned' : ''}). ` : '. ')
        : 'No forest polygons loaded. ') +
      `${roadAreas.features.length} buffered road/rail polygons from ${roads.features.length} centrelines. ` +
      (railwayCandidates.length ? `${railwayCandidates.length} railway mesh features (${railwayItems.length} loaded${railwayModelsPending ? `, ${railwayModelsPending} loading` : ''}${railwayFailures.length ? `, ${railwayFailures.length} failed` : ''}). ` : 'No railway mesh features in railway_models.geojson. ') +
      `${trainRailSegments.length} rail route segments; ${movingTrainCount()} moving, ${dwellingTrainCount()} at a station and ${parkedTrainCount()} parked train(s). ` +
      (eventList.length ? `${eventList.length} events. ` : '') +
      (histMaps.length ? `${histMaps.length} historic map(s).` : 'No maps.json.') +
      (stats.built && (stats.boats || stats.birds) ? ` ${stats.boats} boats and ${stats.birds} birds.` : '') +
      (base.features.length ? '' : ' (Run fetch_base_data.py for water, roads and woods.)');
  }

let frames = 0, goodSecs = 0;
map.on('render', () => frames++);
setInterval(() => {
  if (document.hidden) { frames = 0; return; }
  // ease the water/life frame rate down if the device can't keep up, and back up after a minute of coping fine.
  // Only judged once everything has loaded and the map is still, so start-up work can't trigger it.
  const settled = stats.built && modelsPending === 0 && !map.isMoving();
  if (settled && animFps && animFps === animTarget) {
    if (frames < animTarget * 0.7 && animTarget > 6) {
      animTarget = Math.max(6, Math.round(animTarget * 0.8)); goodSecs = 0; syncAnim();
    } else if (frames >= animTarget * 0.9 && animTarget < TIER.animFps) {
      if (++goodSecs >= 60) { goodSecs = 0; animTarget = Math.min(TIER.animFps, Math.round(animTarget * 1.25)); syncAnim(); }
    } else goodSecs = 0;
  }
  const ri = worldDrawn && sceneLayer.renderer ? sceneLayer.renderer.info : null;
  renderInfo = ri ? `${ri.render.calls} calls · ${Math.round(ri.render.triangles / 1000)}k tris · ${ri.memory.geometries} geo · ${ri.memory.textures} tex` : '';
  if (!$('infoContent').hidden) $('perf').textContent = `${frames} fps · ${QUALITY} quality · trees ${treeGroup.visible ? (stats.treeLod || '—') : 'off'} LOD · last year update ${lastApplyMs.toFixed(0)} ms` +
    (renderInfo ? ` · ${renderInfo}` : '');
  frames = 0;
}, 1000);

  // ============================================================ opening load (drives the loading bar)
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function preloadAssets() {
    preloading = true;
    try {
      const jobs = [ensureModels(), ensureRailwayModels(), ensureBorderModels()];
      const pending = () => modelsPending + railwayModelsPending + borderModelsPending;
      const total = pending();
      if (!total) return;
      const poll = setInterval(() => Loader.set('models', 1 - pending() / total, `Building buildings… ${total - pending()} / ${total}`), 120);
      try {
        await Promise.all(jobs);
        for (let i = 0; i < 300 && pending() > 0; i++) await sleep(100);   // models already queued by an earlier call
      } finally { clearInterval(poll); }
    } finally { preloading = false; }
  }
  async function finishLoading(sceneBuild) {
    try {
      Loader.set('map', 0.5, 'Weathering terrain…');
      await Promise.race([new Promise(r => map.once('idle', r)), sleep(8000)]);
      Loader.set('map', 1, 'Flowing water, fluttering birds, and spreading trees…');
      await sceneBuild;
      Loader.set('scene', 1, 'Building buildings…');
      await preloadAssets();
      Loader.set('models', 1, 'Almost there…');
      map.triggerRepaint();
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));   // let the first full frame draw
    } catch (err) {
      console.warn('Opening load:', err);
    } finally {
      Loader.done();
      prewarmSeasonalTextures(map);            // other seasons' textures, only once the viewer is usable
    }
  }

  // ============================================================ go
  map.on('load', () => {
    try {
      const cam = map.cameraForBounds([[W, S], [E, N]], { padding: 24 });
      HOME = { center: AREA_CENTRE, zoom: cam.zoom, pitch: DEFAULT_PITCH, bearing: DEFAULT_BEARING };
      map.setMinZoom(Math.max(cam.zoom - 0.4, 8));
      map.jumpTo(HOME);
      map.addLayer(sceneLayer);                       // last in the stack: after the mask and the 3D map layers
      applyNightMode($('nightMode').checked);          // apply the initial state once MapLibre's style layers exist
      updateTimelineLabel();
      applySeason($('season').value);
      onYearChange(true);
      resetIdle();
      updateStatus();
      // heavy 3D content is built after the first frame, in small steps, so the map appears straight away
      const sceneBuild = buildSceneContent().catch(err => { console.error('3D content error:', err); statusEl.textContent = `3D content error: ${err?.message || err}`; });
      ensureTrainTraffic();
      finishLoading(sceneBuild);
    } catch (err) {
      console.error('Viewer load error:', err);
      statusEl.textContent = `Viewer load error: ${err?.message || err}`;
    }
  });

  window.__viewer = { map, stats, Uni, treeGroup, waterGroup, mistGroup, boatGroup, birdGroup, smokeGroup, lampLightRoot, railwayRoot, borderRoot, trainGroup, ambientLight, sunLight,
    get nightMode() { return $('nightMode').checked; },
    get ambientIntensity() { return ambientLight.intensity; },
    get landscapeNightOpacity() { return $('nightMode').checked ? NIGHT_LANDSCAPE_OPACITY : 0; },
    get smokeEmitters() { return activeSmokeEmitters; }, get smokeParticles() { return smokeParticleCount; },
    get lampEmitters() { return activeLampEmitters; },
    get lampLightObjects() { let n = 0; lampLightRoot.traverse(o => { if (o.isLight) n++; }); return n; },
    get windowGlowMaterials() { return [...windowGlowMaterials.values()].map(x => x.name); },
    get windowGlowMaterialCount() { return windowGlowMaterials.size; },
    get windowGlassMaterials() { return [...windowGlassMaterials.values()].map(x => x.name); },
    get windowGlassMaterialCount() { return windowGlassMaterials.size; },
    // Shows which GLB files have actually loaded and what material names Three.js sees.
    get modelMaterialDiagnostics() { return [...modelMaterialDiagnostics.values()]; },
    get loadedModelUrls() { return [...modelCache.keys()]; },
    get modelAssetRevision() { return MODEL_ASSET_REVISION; },
    get urbanGroundFeatureCount() { return urbanGroundFeatures.length; },
    get urbanGroundFeatures() { return urbanGroundFeatures.map(f => ({ id: f.properties?.id ?? null, name: f.properties?.name ?? null, from: f.properties?._from, to: f.properties?._to, hardSurfaceYear: f.properties?._urban_hard_from >= 99999 ? null : f.properties?._urban_hard_from })); },
    get urbanGroundVisible() { return $('urbanGroundVis').checked; },
    get borderFeatureCount() { return borders.features.length; },
    get borderModelCandidates() { return borderCandidates.length; },
    get borderModelCount() { return borderItems.length; },
    get borderModelsShown() { return borderModelsShown; },
    get borderModelsPending() { return borderModelsPending; },
    get borderModelsVisible() { return borderRoot.visible; },
    get borderModelFailures() { return borderFailures.slice(); },
    get borderModels() { return borderItems.map(x => ({id:x.id,name:x.name,kind:x.kind,from:x.from,to:x.to,url:x.url,visible:x.group.visible})); },
    get railwayModelFiles() { return railwayItems.map(x => ({ id: x.id, name: x.name, url: x.url, from: x.from, to: x.to, visible: x.group.visible })); },
    get railwayModelCount() { return railwayItems.length; },
    get railwayModelCandidates() { return railwayCandidates.length; },
    get railwayModelFailures() { return railwayFailures.slice(); },
    get railwayModelsShown() { return railwayModelsShown; },
    get railwayModelsPending() { return railwayModelsPending; },
    get railwayModelsVisible() { return railwayRoot.visible; },
    get trainTrafficEnabled() { return trainTrafficOn; },
    get trainRouteSegmentCount() { return trainRailSegments.length; },
    get trainActiveCount() { return activeTrains.length; },
    get trainMovingCount() { return movingTrainCount(); },
    get trainDwellingCount() { return dwellingTrainCount(); },
    get trainParkedCount() { return parkedTrainCount(); },
    get trainModelLoaded() { return trainTemplateCache.size > 0; },
    get trainModelUrl() { return trainModelUrl(trainFleetForYear(year()).locomotive); },
    get trainAssetFailure() { return Object.fromEntries(trainAssetFailures); },
    get trainRoutes() { return trainRailSegments.map(s => ({ id: s.sourceId, name: s.name, length: s.length, from: s.from, to: s.to, bridge: s.bridge })); },
    get trainFleet() { return trainFleetForYear(year()); },
    get trainStates() { return activeTrains.map(t => ({ consist: t.config.id, state: t.state, station: t.stationStopName || null, stationStopPending: Number.isFinite(t.stationStopDistance), progress_m: Math.round(t.progress), speed_mps: Number(t.speed.toFixed(2)) })); },
    get trainStationStops() { return TRAIN_STATIONS.map(s => ({ name: s.name, lon: s.lon, lat: s.lat })); },
    get boats() { return boats; }, boatState, frame, waterColour, waterHi, waterLo, waterStrength,
    get hf() { return hf; }, get modelFailures() { return modelFailureDetails.slice(); }, get modelFallbackCount() { return modelFallbackCount; } };   // handy for debugging in the console
}

start().catch(err => {
  statusEl.textContent = 'Failed: ' + err.message;
  Loader.fail('Failed to start, see the status panel');
  console.error(err);
});
</script>
</body>
</html>
