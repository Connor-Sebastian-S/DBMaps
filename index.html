<script>
// Loading screen. While it is up, the map, timeline and side panels are `inert` (no pointer, keyboard or focus
// input) and the overlay itself swallows every event. It always releases: on completion, on any startup error,
// or after a safety timeout, so a failed download can never lock the page.
window.Loader = (() => {
  const $ = id => document.getElementById(id);
  const root = $('loader'), bar = root.querySelector('.ld-bar'), label = root.querySelector('.ld-label'), pctEl = root.querySelector('.ld-pct');
  const LOCKED = ['map', 'timelineBar', 'side'];
  const WEIGHT = { data: 0.20, tex: 0.08, map: 0.17, scene: 0.25, models: 0.30 };   // share of the bar per stage
  const got = {}; let shown = 0, released = false;
  const lock = on => LOCKED.forEach(id => { const e = $(id); if (e) e.inert = on; });
  lock(true);
  function render() {
    let p = 0; for (const k in WEIGHT) p += WEIGHT[k] * (got[k] || 0);
    shown = Math.max(shown, Math.min(1, p));                       // never moves backwards
    bar.style.transform = `scaleX(${shown})`;
    const pct = Math.round(shown * 100);
    pctEl.textContent = pct + '%'; root.setAttribute('aria-valuenow', pct);
  }
  function release(text) {
    if (released) return; released = true;
    clearTimeout(safety);
    if (text) label.textContent = text;
    for (const k in WEIGHT) got[k] = 1; render();
    setTimeout(() => { root.classList.add('hide'); lock(false); setTimeout(() => root.remove(), 600); }, 300);
  }
  const safety = setTimeout(() => release('Taking longer than expected, continuing…'), 90000);
  return {
    set(stage, f, text) { if (released) return; got[stage] = Math.max(got[stage] || 0, Math.min(1, f)); if (text) label.textContent = text; render(); },
    track(stage) { let n = 0, d = 0; return p => { n++; return Promise.resolve(p).finally(() => Loader.set(stage, ++d / n)); }; },
    done: () => release('Ready'),
    fail: msg => release(msg),
  };
})();
window.addEventListener('error', event => {
  const el = document.getElementById('status');
  if (el && event.message) el.textContent = `JavaScript error: ${event.message}`;
  if (event.message && !/^ResizeObserver/.test(event.message)) Loader.fail('Something went wrong, see the status panel');
});
window.addEventListener('unhandledrejection', event => {
  const el = document.getElementById('status');
  const reason = event.reason && (event.reason.message || String(event.reason));
  if (el) el.textContent = `Startup error: ${reason || 'unknown promise rejection'}`;
  Loader.fail('Something went wrong, see the status panel');
});
</script>

// Tileable ground textures, drawn once per season on demand (see styleimagemissing) as semi-transparent
// speckle over the colour layer beneath: fallen leaves, conifer needles, grass blades. MapLibre drapes
// them over the terrain, so they follow the ground exactly and the hillshade still shades them.
function drawPattern(kind, season) {

  cv.width = cv.height = S;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  let seed = 7; for (const ch of kind + season) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = mulberry32(seed), pick = a => a[Math.floor(rnd() * a.length)], range = (a, b) => a + (b - a) * rnd();
  // every mark is drawn again offset by +-S so the tile repeats without seams
  const wrapped = (x, y, r, draw) => {
    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) { const X = x + dx, Y = y + dy; if (X > -r && X < S + r && Y > -r && Y < S + r) draw(X, Y); }
  };
  const blob = (col, a, rx, ry, rot) => {
    wrapped(rnd() * S, rnd() * S, Math.max(rx, ry) + 1, (X, Y) => {
      ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(X, Y, rx, ry, rot, 0, Math.PI * 2); ctx.fill();
    });

    const dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;

      ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X + dx, Y + dy); ctx.stroke();
    });

  const frost = n => { for (let i = 0; i < n; i++) blob('#ffffff', range(0.2, 0.4), range(0.8, 1.8), range(0.8, 1.8), 0); };
  const dots = (n, cols) => { for (let i = 0; i < n; i++) blob(pick(cols), 0.9, range(1.1, 1.8), range(1.1, 1.8), 0); };

  if (kind === 'litter') {                                    // broadleaf and mixed woods: fallen leaves
    const pal = {
      autumn: ['#c9692b', '#d8953a', '#a4442a', '#e0b34c', '#8a5a30', '#b9803f'],
      winter: ['#7b6b55', '#8e7c64', '#6c5e4e', '#a3957a'],
      spring: ['#7ba958', '#9cc56b', '#b6d57b', '#8b7049'],
      summer: ['#3e7a3b', '#4e8a45', '#2e6a37', '#5b904b', '#6c5b3b'],
    }[season];
    const count = { autumn: 100, winter: 85, spring: 55, summer: 60 }[season];
    for (let i = 0; i < count; i++) blob(pick(pal), range(0.6, 0.9), range(3.5, 6.5), range(1.8, 3), rnd() * Math.PI);
    for (let i = 0; i < 14; i++) stroke('#4a3524', 0.5, range(7, 16), rnd() * Math.PI, 1.1);     // twigs
    if (season === 'winter') frost(26);
    if (season === 'spring') dots(10, ['#ffffff', '#f4f1c9']);                                   // wood anemones
  } else if (kind === 'needles') {                            // conifer floors: needles and a little moss
    const pal = ['#6b4a2e', '#7d5a38', '#5a3f27', '#8a6a45'];
    for (let i = 0; i < 6; i++) blob('#3b2a1a', 0.22, range(8, 14), range(5, 9), rnd() * Math.PI);
    for (let i = 0; i < 260; i++) stroke(pick(pal), range(0.55, 0.85), range(5, 11), rnd() * Math.PI, 1);
    if (season === 'spring' || season === 'summer') for (let i = 0; i < 26; i++) blob('#5d8a4a', 0.35, range(1.5, 3), range(1.5, 3), 0);
    if (season === 'winter') frost(22);
  } else {                                                    // grass blades
    const pal = {
      spring: ['#7fc05a', '#9ad66f', '#6aa84b', '#b2e083'],
      summer: ['#6aa84b', '#7fbb59', '#5a9440', '#8fc965'],
      autumn: ['#b4a85a', '#a0914c', '#c9b96a', '#8f7f45', '#bf7a3a'],
      winter: ['#c8c0a0', '#b5ad8c', '#d6d0b8', '#a39b7c'],
    }[season];
    for (let i = 0; i < 320; i++) stroke(pick(pal), range(0.5, 0.85), range(5, 11), -Math.PI / 2 + range(-0.7, 0.7), range(1, 1.4));
    if (season === 'spring') dots(14, ['#ffffff', '#fff3a8']);                                   // daisies and buttercups
    if (season === 'summer') dots(6, ['#ffffff', '#f2d26b']);
    if (season === 'winter') frost(30);
  }
  ctx.globalAlpha = 1;
  return ctx.getImageData(0, 0, S, S);
}

  })());

    const bmp = await loadBitmap(TEXTURE_DIR + file);

  await Promise.all([

// One instance = one tree. The shared low-poly mesh is shaped by per-instance parameters (see
// packTreeChunk in viewer_utils.js). Trees outside their date range are collapsed off-screen.
const TREE_VERT = /* glsl */`
attribute float aPart;
attribute vec4 aA, aB, aC, aD;
uniform float uYear;
uniform vec3 uLeafFrom[4], uLeafTo[4];
uniform float uSeasonMix, uNightMix;
uniform vec3 uTrunk;
varying vec3 vCol;
void main() {

    p = vec3(position.xy * max(aC.y * H, 0.16), position.z * aB.y * H);
  } else {                                            // crown
    vec3 q = position * (aPart > 1.5 ? aD.z : 1.0);   // side clumps shrink towards the crown centre

      p = vec3(q.xy * R, aB.z * H + q.z * Z);
    #else
      float Z = aC.x * H;
      p = vec3(q.xy * R, aB.z * H + q.z * Z);

void main() { gl_FragColor = vec4(vCol, 1.0); }`;

// Water surface: a small seamless noise texture slid along each point's flow vector (metres per second,
// in world space). Two copies half a cycle apart are cross-faded so the pattern never visibly resets.
// The texture is looked up in plain world coordinates and only OFFSET along the flow, so every ripple
// travels the way the water does. (Rotating the lookup into a flow-aligned frame swirled the ripples in all
// directions, because the rotation changes from place to place and gets multiplied by the distance from the
// origin.) The elongated streaks come from averaging two samples along the current instead.
const WATER_VERT = /* glsl */`
attribute vec2 aFlow;
attribute vec2 aYears;
uniform float uLift;
varying vec2 vXY, vFlow, vYears;
void main() {
  vXY = position.xy; vFlow = aFlow; vYears = aYears;

uniform sampler2D uNoise;

  vec2 dir = sp > 1e-4 ? vFlow / sp : vec2(1.0, 0.0);

  float speed = mix(0.05, max(sp, 0.45), moving);

  vec2 along = dir * (1.3 / SCALE) * moving;                        // half-length of the streak

  float n0 = texture2D(uNoise, c0).r;                               // one sample per copy: half the texture reads
  float n1 = texture2D(uNoise, c1).r;
#else
  float n0 = 0.5 * (texture2D(uNoise, c0 - along).r + texture2D(uNoise, c0 + along).r);
  float n1 = 0.5 * (texture2D(uNoise, c1 - along).r + texture2D(uNoise, c1 + along).r);

}`;

const BIRD_VERT = /* glsl */`
attribute float aWing;                       // 0 at the body .. 1 at the wing tip
attribute vec4 aA, aB, aC, aD, aE;           // see planBirds in viewer_utils.js
uniform float uTime, uBirdScale, uNightMix;
varying vec3 vCol;

void main() { gl_FragColor = vec4(vCol, 1.0); }`;

// Transparent, tileable textures for the MapLibre road polygons. The underlying fill supplies

function drawRoadPattern(kind, season = 'summer') {

  const wrapped = (x, y, r, draw) => {
    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) {
      const X = x + dx, Y = y + dy;
      if (X > -r && X < S + r && Y > -r && Y < S + r) draw(X, Y);
    }
  };
  const speck = (col, alpha, rx, ry = rx) => {
    wrapped(rnd() * S, rnd() * S, Math.max(rx, ry) + 2, (x, y) => {
      ctx.fillStyle = `rgba(${col},${alpha})`;
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rnd() * Math.PI, 0, Math.PI * 2); ctx.fill();
    });
  };
  const stroke = (col, alpha, len, width) => {
    const x = rnd() * S, y = rnd() * S, a = rnd() * Math.PI * 2;
    const dx = Math.cos(a) * len, dy = Math.sin(a) * len;
    wrapped(x, y, len + width + 2, (X, Y) => {
      ctx.strokeStyle = `rgba(${col},${alpha})`; ctx.lineWidth = width; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X + dx, Y + dy); ctx.stroke();
    });
  };

  if (kind === 'earth') {
    // Old carriage roads: compacted earth with damp, dark patches and embedded grit.
    for (let i = 0; i < 105; i++) speck(pick(['43,32,24', '59,42,29', '77,54,36', '94,68,46']), range(0.20, 0.43), range(2.0, 5.8), range(1.0, 3.0));
    for (let i = 0; i < 150; i++) speck(pick(['76,55,35', '110,82,52', '132,105,71', '66,52,39']), range(0.12, 0.28), range(0.55, 1.7), range(0.45, 1.2));
    for (let i = 0; i < 30; i++) stroke(pick(['48,35,26', '83,62,42', '137,105,68']), range(0.18, 0.34), range(4, 12), range(0.55, 1.25));
    // A few lighter stones keep the surface earthy rather than turning it into a uniform brown strip.
    for (let i = 0; i < 28; i++) speck(pick(['150,133,104', '123,111,88', '91,82,66']), range(0.20, 0.36), range(0.8, 1.9), range(0.6, 1.3));
  } else if (kind === 'mud') {
    // Saturated track surface: broad dark mud patches, wheel-smeared streaks and small wet highlights.
    for (let i = 0; i < 115; i++) speck(pick(['35,26,20', '48,34,25', '61,42,29', '77,52,35']), range(0.34, 0.62), range(2.8, 7.8), range(1.5, 4.2));
    for (let i = 0; i < 175; i++) speck(pick(['31,25,20', '68,48,32', '91,65,42', '111,81,54']), range(0.18, 0.36), range(0.65, 1.9), range(0.5, 1.3));
    for (let i = 0; i < 38; i++) stroke(pick(['35,26,20', '49,35,26', '82,59,39']), range(0.24, 0.43), range(6, 19), range(0.7, 1.6));
    for (let i = 0; i < 24; i++) speck(pick(['143,124,97', '160,139,108']), range(0.12, 0.22), range(1.1, 3.0), range(0.7, 1.8));
  } else if (kind === 'gravel' || kind === 'ballast') {
    const palette = kind === 'ballast'
      ? ['76,73,67', '100,96,87', '126,120,107', '57,57,53']
      : ['111,99,80', '143,128,104', '166,151,126', '87,78,66'];
    for (let i = 0; i < (kind === 'ballast' ? 170 : 135); i++) {
      const x = rnd() * S, y = rnd() * S, rx = range(1.1, kind === 'ballast' ? 3.8 : 3.1), ry = rx * range(0.55, 0.9);
      wrapped(x, y, rx + 2, (X, Y) => {
        ctx.fillStyle = `rgba(${pick(palette)},${range(0.30, 0.62)})`;
        ctx.beginPath(); ctx.ellipse(X, Y, rx, ry, rnd() * Math.PI, 0, Math.PI * 2); ctx.fill();
      });
    }
  } else if (kind === 'cobble') {
    const cols = 18, rows = 18, cw = S / cols, ch = S / rows;
    for (let j = -1; j <= rows; j++) for (let i = -1; i <= cols; i++) {
      const x = i * cw + (j % 2 ? cw * 0.5 : 0) + cw * 0.5;
      const y = j * ch + ch * 0.5;
      const w = cw * range(0.72, 0.88), h = ch * range(0.62, 0.78), rot = range(-0.09, 0.09);
      const tone = pick(['133,126,113', '157,149,134', '181,171,153', '111,107,99']);
      wrapped(x, y, cw, (X, Y) => {
        ctx.save(); ctx.translate(X, Y); ctx.rotate(rot);
        ctx.fillStyle = `rgba(47,43,37,0.58)`;
        ctx.beginPath(); ctx.roundRect(-w / 2 - 0.7, -h / 2 - 0.7, w + 1.4, h + 1.4, 2.3); ctx.fill();
        ctx.fillStyle = `rgba(${tone},0.78)`;
        ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 2); ctx.fill();
        ctx.strokeStyle = 'rgba(220,211,191,0.20)'; ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.moveTo(-w * 0.34, -h * 0.25); ctx.lineTo(w * 0.28, -h * 0.25); ctx.stroke();
        ctx.restore();
      });
    }
  } else if (kind === 'asphalt') {
    for (let i = 0; i < 390; i++) speck(pick(['205,205,198', '20,22,24', '130,132,131', '91,94,94']), range(0.12, 0.28), range(0.35, 1.05), range(0.35, 0.85));
    for (let i = 0; i < 28; i++) stroke('12,14,16', range(0.08, 0.16), range(2, 6), range(0.35, 0.7));
  }
  // Small, material-aware seasonal cues keep the four variants distinct without changing the road geometry.
  if (season === 'winter') {
    for (let i = 0; i < 34; i++) speck('224,232,232', range(0.12, 0.24), range(1.0, 2.8), range(0.7, 1.5));
  } else if (season === 'autumn') {
    for (let i = 0; i < 24; i++) speck(pick(['154,91,43', '177,111,48', '119,73,42']), range(0.16, 0.28), range(1.0, 2.2), range(0.6, 1.3));
  } else if (season === 'spring') {
    for (let i = 0; i < 18; i++) speck(pick(['91,112,68', '129,145,91']), range(0.10, 0.20), range(0.8, 1.8), range(0.6, 1.1));
  }
  ctx.globalAlpha = 1;
  return ctx.getImageData(0, 0, S, S);
}

// Seamless value-noise texture for the water ripples.
function makeNoiseTexture(size = 128) {
  const rnd = mulberry32(7);
  const octaves = [[8, 0.5], [16, 0.3], [32, 0.2]].map(([cells, w]) => ({ cells, w, g: Float32Array.from({ length: cells * cells }, rnd) }));
  const smooth = t => t * t * (3 - 2 * t);
  const v = new Float32Array(size * size);
  let lo = Infinity, hi = -Infinity;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let sum = 0;
    for (const { cells: c, w, g } of octaves) {
      const fx = x / size * c, fy = y / size * c, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = smooth(fx - x0), ty = smooth(fy - y0);
      const a = g[(y0 % c) * c + x0 % c], b = g[(y0 % c) * c + (x0 + 1) % c];
      const d = g[((y0 + 1) % c) * c + x0 % c], e = g[((y0 + 1) % c) * c + (x0 + 1) % c];
      sum += w * ((a * (1 - tx) + b * tx) * (1 - ty) + (d * (1 - tx) + e * tx) * ty);
    }
    v[y * size + x] = sum; lo = Math.min(lo, sum); hi = Math.max(hi, sum);
  }
  const data = new Uint8Array(size * size);
  for (let i = 0; i < data.length; i++) data[i] = Math.round((v[i] - lo) / (hi - lo) * 255);
  const tex = new THREE.DataTexture(data, size, size, THREE.RedFormat, THREE.UnsignedByteType);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true; tex.unpackAlignment = 1; tex.needsUpdate = true;
  return tex;
}

// Soft, irregular cloud alpha for chimney smoke. Several overlapping Gaussian lobes give
// it a broken, billowing outline rather than the hard edge of a plain circular sprite.
function makeSmokeTexture(size = 128) {
  const rnd = mulberry32(7319);
  const lobes = [{ x: 0.50, y: 0.50, r: 0.27, a: 0.62 }];
  for (let i = 0; i < 10; i++) lobes.push({
    x: 0.23 + rnd() * 0.54, y: 0.20 + rnd() * 0.60,
    r: 0.10 + rnd() * 0.17, a: 0.20 + rnd() * 0.34,
  });
  const noiseSize = 16, noise = Float32Array.from({ length: noiseSize * noiseSize }, rnd);
  const data = new Uint8Array(size * size * 4);
  const smooth = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / (size - 1), v = y / (size - 1);
    let density = 0;
    for (const l of lobes) {
      const dx = (u - l.x) / l.r, dy = (v - l.y) / (l.r * 1.18);
      density += l.a * Math.exp(-2.2 * (dx * dx + dy * dy));
    }
    const gx = u * (noiseSize - 1), gy = v * (noiseSize - 1);
    const ix = Math.min(noiseSize - 2, Math.floor(gx)), iy = Math.min(noiseSize - 2, Math.floor(gy));
    const fx = gx - ix, fy = gy - iy;
    const n0 = noise[iy * noiseSize + ix] * (1 - fx) + noise[iy * noiseSize + ix + 1] * fx;
    const n1 = noise[(iy + 1) * noiseSize + ix] * (1 - fx) + noise[(iy + 1) * noiseSize + ix + 1] * fx;
    const n = n0 * (1 - fy) + n1 * fy;
    const edge = smooth((Math.min(u, 1 - u, v, 1 - v) + 0.025) / 0.20);
    const alpha = Math.max(0, Math.min(0.72, smooth((density * (0.78 + n * 0.42) - 0.10) / 0.54) * 0.66 * edge));
    const i = (y * size + x) * 4;
    const shade = Math.round(235 + n * 20);
    data[i] = data[i + 1] = data[i + 2] = shade;
    data[i + 3] = Math.round(alpha * 255);
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.UnsignedByteType);
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true; tex.unpackAlignment = 1; tex.needsUpdate = true;
  return tex;
}

// earcut-style adapter around Three's triangulator
function triangulate(flat, holes) {
  const pts = [];
  for (let i = 0; i < flat.length; i += 2) pts.push(new THREE.Vector2(flat[i], flat[i + 1]));
  const ends = [...holes, pts.length];
  const faces = THREE.ShapeUtils.triangulateShape(pts.slice(0, ends[0]), holes.map((h, k) => pts.slice(h, ends[k + 1])));
  const out = [];
  for (const f of faces) out.push(f[0], f[1], f[2]);
  return out;
}

// ============================================================ main
async function start() {
  // Warm the glTF loader modules now (the import map is active here), so they are cached before the first model is needed.
  for (const m of ['loaders/GLTFLoader.js', 'loaders/DRACOLoader.js', 'libs/meshopt_decoder.module.js']) import('three/addons/' + m).catch(() => {});
  // Ground textures for the starting season download alongside the data files below, not after them.
  const season0 = resolveSeason($('season').value);
  const groundImagesPromise = Promise.all(Object.keys(GROUND_FILES).map(kind => groundImage(kind, season0)));
  const dataPromise = Promise.all([
    getJson('tiles/meta.json', null),
    getJson('base.geojson', { type: 'FeatureCollection', features: [] }),
    getJson('buildings_master.geojson', null).then(m => m || getJson('buildings.geojson', null)),
    getJson('maps.json', { maps: [] }),
    getJsonFirst(FOREST_FILES, null),
    getJson('events.json', { events: [] }),
    getJson('roads.geojson', { type: 'FeatureCollection', features: [] }),
    getJson('roads_areas.geojson', { type: 'FeatureCollection', features: [] }),
    getJson('railway_models.geojson', { type: 'FeatureCollection', features: [] }),
    getJson('borders.geojson', { type: 'FeatureCollection', features: [] }),
    getJson('border_models.geojson', { type: 'FeatureCollection', features: [] }),
    loadBitmap(TEXTURE_DIR + WATER_FILE),
  ].map(Loader.track('data')));
  const roadImages = ROAD_TEXTURE_KINDS.map(kind => drawRoadPattern(kind, season0));   // drawn while the downloads are in flight
  const [demMeta, baseRaw, masterRaw, mapsCfgRaw, forestsRaw, eventsCfgRaw, roadsRaw, roadAreasRaw, railwayModelsRaw, bordersRaw, borderModelsRaw, waterBitmap] = await dataPromise;

  const demTiles = demMeta ? [BASE + LOCAL_DEM] : [GLOBAL_DEM];
  const demMax = Math.min(demMeta ? demMeta.maxzoom : 15, TERRAIN_MAXZOOM);
  Loader.set('data', 1, 'Preparing terrain and textures…');
  const [W, S, E, N] = AREA;

  // ---- local frame + terrain heights (shared by trees, water, mist). Start fetching straight away.
  const frame = makeFrame(AREA_CENTRE);
  const [lbW, lbS] = frame.toLocal(W, S), [lbE, lbN] = frame.toLocal(E, N);
  const LOCAL_BOX = [lbW, lbS, lbE, lbN];
  const heightfieldPromise = loadHeightfield().catch(err => { console.warn('Height field failed:', err); return null; });

  async function loadHeightfield() {
    const z = Math.max(demMeta ? demMeta.minzoom : 0, Math.min(demMax, TIER.heightZoom));
    const px = 256 * 2 ** z;
    const gx0 = Math.floor(mercX(W) * px) - 1, gx1 = Math.ceil(mercX(E) * px) + 1;
    const gy0 = Math.floor(mercY(N) * px) - 1, gy1 = Math.ceil(mercY(S) * px) + 1;
    const nx = gx1 - gx0 + 1, ny = gy1 - gy0 + 1;
    const data = new Int16Array(nx * ny).fill(-32768);
    const jobs = [];
    for (let ty = Math.floor(gy0 / 256); ty <= Math.floor(gy1 / 256); ty++)
      for (let tx = Math.floor(gx0 / 256); tx <= Math.floor(gx1 / 256); tx++)
        jobs.push({ tx, ty, url: demTiles[0].replace('{z}', z).replace('{x}', tx).replace('{y}', ty) });
    const blobs = await Promise.all(jobs.map(j => fetch(j.url).then(r => r.ok ? r.blob() : null).catch(() => null)));
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 256;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let valid = 0;
    for (let k = 0; k < jobs.length; k++) {
      if (!blobs[k]) continue;
      const bmp = await createImageBitmap(blobs[k], { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
      if (bmp.width !== 256 || bmp.height !== 256) { bmp.close(); continue; }
      ctx.clearRect(0, 0, 256, 256);
      ctx.drawImage(bmp, 0, 0);
      bmp.close();
      const px4 = ctx.getImageData(0, 0, 256, 256).data;
      const { tx, ty } = jobs[k];
      for (let y = 0; y < 256; y++) {
        const gy = ty * 256 + y;
        if (gy < gy0 || gy > gy1) continue;
        for (let x = 0; x < 256; x++) {
          const gx = tx * 256 + x;
          if (gx < gx0 || gx > gx1) continue;
          const o = (y * 256 + x) * 4;
          if (px4[o + 3] === 0) continue;                              // transparent = no data
          const h = Math.round(terrariumM(px4[o], px4[o + 1], px4[o + 2]) * 10);
          if (h > -32000 && h < 32000) { data[(gy - gy0) * nx + (gx - gx0)] = h; valid++; }
        }
      }
    }
    if (!valid) return null;
    if (valid < data.length) {                                         // fill gaps with the mean height
      let sum = 0; for (let i = 0; i < data.length; i++) if (data[i] !== -32768) sum += data[i];
      const mean = Math.round(sum / valid);
      for (let i = 0; i < data.length; i++) if (data[i] === -32768) data[i] = mean;
    }
    // MapLibre's terrain treats a DEM texel as sitting at its top-left corner (not its centre), so use the same
    // convention; surfaces on top still get a slope-aware margin (tolerantHeight) because GPUs differ by a texel or so.
    return new Heightfield({ x0: gx0 / px, y0: gy0 / px, dx: 1 / px, dy: 1 / px, nx, ny, data });
  }

  // ---- data preparation: keep only what touches the mapped area
  const asFc = (raw, keep) => ({
    type: 'FeatureCollection',
    features: (raw && Array.isArray(raw.features) ? raw.features : []).filter(f => {
      try { return f?.geometry && keep(f); } catch (_) { return false; }
    }),
  });
  const overlapsArea = f => bboxesOverlap(geomBBox(f.geometry), AREA);

  // Numeric visibility window precomputed once per feature (like the _road_* fields below), so the date filters
  // are two cheap comparisons and the change points of each source can be listed up front.
  const datedProps = (p, undatedFrom) => ({
    _from: toYear(p.from_year) ?? undatedFrom ?? -99999,
    _to: toYear(p.to_year) ?? 99999,
  });
  // Urbanised ground is stored in base.geojson alongside green/wood/water polygons.
  // `hard_surface_year` is the year the area changes from earthy ground to a muted
  // grey hard surface; when omitted, the area stays earthy for its whole date range.
  const base = asFc(baseRaw, overlapsArea);
  base.features = base.features.map(f => {
    const p = f.properties || {};
    return { ...f, properties: { ...p, ...datedProps(p, null),
      _urban_hard_from: toYear(p.hard_surface_year) ?? 99999,
    }};
  });
  const urbanGroundFeatures = base.features.filter(f => String(f.properties?.kind || '').toLowerCase() === 'urban');
  // Borders are authored as LineString/MultiLineString features in borders.geojson.
  // The mesh builder emits terrain-conformable GLBs and a separate Point manifest.
  const borders = asFc(bordersRaw, overlapsArea);
  borders.features = borders.features.map(f => {
    const p = f.properties || {};
    return { ...f, properties: { ...p, ...datedProps(p, null) } };
  });
  const borderModels = asFc(borderModelsRaw, f => {
    const p = f.properties || {};
    const c = f.geometry?.type === 'Point' ? f.geometry.coordinates : null;
    const lon = Number(p.model_lon != null ? p.model_lon : c?.[0]);
    const lat = Number(p.model_lat != null ? p.model_lat : c?.[1]);
    return typeof p.model === 'string' && p.model.trim() !== '' && Number.isFinite(lon) && Number.isFinite(lat)
      && (inBounds([lon, lat], AREA) || (Array.isArray(p.model_bbox) && p.model_bbox.length === 4
        && p.model_bbox[0] <= AREA[2] && p.model_bbox[2] >= AREA[0] && p.model_bbox[1] <= AREA[3] && p.model_bbox[3] >= AREA[1]));
  });
  borderModels.features = borderModels.features.map(f => {
    const p = f.properties || {};
    const c = f.geometry?.type === 'Point' ? f.geometry.coordinates : [];
    return { ...f, properties: { ...p,
      model_lon: Number(p.model_lon != null ? p.model_lon : c[0]),
      model_lat: Number(p.model_lat != null ? p.model_lat : c[1]),
      from_year: toYear(p.from_year), to_year: toYear(p.to_year),
    }};
  });
  const roads = asFc(roadsRaw, overlapsArea);
  const roadAreas = asFc(roadAreasRaw, overlapsArea);
  const railFeatureBySource = new Map();
  const railFeatureById = new Map();
  for (const feature of roads.features) {
    const p = feature.properties || {};
    if (String(p.kind || '').toLowerCase() !== 'rail') continue;
    if (p.src != null) railFeatureBySource.set(String(p.src), feature);
    if (p.id != null) railFeatureById.set(String(p.id), feature);
  }

  // Generated railway manifest: each Point is the local origin of one per-feature GLB.
  // The GLBs use metres, +X east, +Y up and -Z north; model_lon/model_lat locate that origin.
  const railwayModels = asFc(railwayModelsRaw, f => {
    const p = f.properties || {};
    const coords = f.geometry?.type === 'Point' ? f.geometry.coordinates : null;
    const lonValue = p.model_lon != null ? p.model_lon : coords?.[0];
    const latValue = p.model_lat != null ? p.model_lat : coords?.[1];
    const lon = Number(lonValue), lat = Number(latValue);
    return typeof p.model === 'string' && p.model.trim() !== '' &&
      Number.isFinite(lon) && Number.isFinite(lat) && inBounds([lon, lat], AREA);
  });
  railwayModels.features = railwayModels.features.map(f => {
    const p = f.properties || {};
    const coords = f.geometry?.type === 'Point' ? f.geometry.coordinates : [];
    return { ...f, properties: { ...p,
      model_lon: Number(p.model_lon != null ? p.model_lon : coords[0]),
      model_lat: Number(p.model_lat != null ? p.model_lat : coords[1]),
      from_year: toYear(p.from_year), to_year: toYear(p.to_year),
    }};
  });

  // MapLibre's legacy layer-filter parser expects property names in comparison filters,
  // not nested expression arrays. Precompute the material/date fields once so the road
  // layers can use compact, reliable property filters when the annual year selection changes.
  const firstYear = (...values) => {
    for (const value of values) {
      const n = toYear(value);
      if (n !== null) return n;
    }
    return null;
  };
  const roadSurfaceProps = p => {
    const kind = String(p.kind || '').toLowerCase();
    const cls = String(p.cls || '').toLowerCase();
    const from = toYear(p.from_year), to = toYear(p.to_year);
    const surface = kind === 'rail' ? 'rail'
      : (kind === 'road' && cls === 'track') ? 'track'
      : (kind === 'path' || kind === 'trail') ? 'path'
      : (kind === 'road' && (cls === 'major' || cls === 'minor')) ? 'carriageway'
      : 'other';
    const cobbleYear = firstYear(p.cobble_year, p.cobbled_year, p.cobbles_year, p.setts_year, p.stone_year)
      ?? (cls === 'major' ? 1820 : 1870);
    const tarmacYear = firstYear(p.tarmac_year, p.asphalt_year, p.surfaced_year, p.macadam_year)
      ?? (cls === 'major' ? 1935 : 1955);
    return {
      from_year: from, to_year: to,
      _road_from: from == null ? -99999 : from,
      _road_to: to == null ? 99999 : to,
      _road_surface: surface,
      _road_cobble_year: cobbleYear,
      _road_tarmac_year: tarmacYear,
      _road_marking_year: Math.max(tarmacYear, 1960),
    };
  };
  // Keep the source attributes intact; the underscored fields are rendering helpers only.
  roads.features = roads.features.map(f => ({
    ...f, properties: { ...(f.properties || {}), ...roadSurfaceProps(f.properties || {}) }
  }));
  roadAreas.features = roadAreas.features.map(f => ({
    ...f, properties: { ...(f.properties || {}), ...roadSurfaceProps(f.properties || {}) }
  }));
  if (!roadAreas.features.length) {
    console.warn('No buffered road polygons loaded from roads_areas.geojson');
    statusEl.textContent = 'Warning: roads_areas.geojson was not loaded (check the filename and project root)';
  }
  const forests = asFc(forestsRaw, overlapsArea);
  // forests use the same from_year/to_year convention as buildings; make sure they are numbers (or null)
  forests.features = forests.features.map(f => {
    const p = f.properties || {};
    return { ...f, properties: { ...p,
      from_year: p.from_year == null ? null : Number(p.from_year),
      to_year: p.to_year == null ? null : Number(p.to_year),
      ...datedProps(p, FOREST_UNDATED_FROM) } };
  });

  const mapsCfg = mapsCfgRaw && Array.isArray(mapsCfgRaw.maps) ? mapsCfgRaw : { maps: [] };
  const eventsCfg = eventsCfgRaw && Array.isArray(eventsCfgRaw.events) ? eventsCfgRaw : { events: [] };

  // Buildings: models are placed by centroid; everything else is clipped to the area so no footprint
  // pokes outside it.
  let master = null;
  if (masterRaw) {

    for (const f of Array.isArray(masterRaw.features) ? masterRaw.features : []) {

        } else {

  }
  if (master) master.features = master.features.map(f =>
    ({ ...f, properties: { ...(f.properties || {}), ...datedProps(f.properties || {}, MODERN_FROM) } }));
  // The GLB path is stored per feature in properties.model. Resolve it against the
  // page URL so both project-relative paths (models/id.glb) and root-relative paths work.
  const MODEL_ASSET_REVISION = 'window-materials-v21-two-types-20261120';
  const modelUrl = feature => {
    const value = feature?.properties?.model;
    if (typeof value !== 'string' || !value.trim()) return null;
    // Model paths are project-relative (for example, models/b000123.glb), just like
    // the other project assets. Use the project directory rather than document.baseURI
    // so a page-level <base> element cannot silently redirect model requests.
    // The revision query forces the browser and local static server to request the
    // current GLB rather than reuse a cached response from before a material rename.
    try {
      const url = new URL(value.trim().replace(/\\/g, '/'), BASE);
      url.searchParams.set('assetrev', MODEL_ASSET_REVISION);
      return url.href;
    } catch (_) { return null; }
  };
  // Chimney markers live beside the building model and are named from the GeoJSON ID:
  // models/42.glb -> models/42_chimney.glb. A missing companion file simply means no smoke.
  const chimneyModelUrl = feature => {
    const id = feature?.properties?.id;
    const buildingUrl = modelUrl(feature);
    if (id == null || String(id).trim() === '' || !buildingUrl) return null;
    try { return new URL(`${encodeURIComponent(String(id).trim())}_chimney.glb`, new URL('.', buildingUrl)).href; }
    catch (_) { return null; }
  };
  // Artificial lamp positions use the same companion-file convention:
  // models/1003.glb -> models/1003_lights.glb.
  const lightMarkerModelUrl = feature => {
    const id = feature?.properties?.id;
    const buildingUrl = modelUrl(feature);
    if (id == null || String(id).trim() === '' || !buildingUrl) return null;
    try { return new URL(`${encodeURIComponent(String(id).trim())}_lights.glb`, new URL('.', buildingUrl)).href; }
    catch (_) { return null; }
  };
  const modelCandidates = master
    ? master.features.filter(f => modelUrl(f) !== null)
    : [];
  const RAILWAY_ASSET_REVISION = 'railway-bridge-profile-v3-short-segments-20261119';
  const railwayModelUrl = feature => {
    const value = feature?.properties?.model;
    if (typeof value !== 'string' || !value.trim()) return null;
    try {
      const url = new URL(value.trim().replace(/\\/g, '/'), BASE);
      url.searchParams.set('assetrev', RAILWAY_ASSET_REVISION);
      return url.href;
    } catch (_) { return null; }
  };
  const railwayCandidates = railwayModels.features.filter(f => railwayModelUrl(f) !== null);
  const RAILWAY_MODEL_MIN_ZOOM = 14.5;
  const BORDER_ASSET_REVISION = 'low-poly-borders-v1-terrain-conform-20261120';
  const borderModelUrl = feature => {
    const value = feature?.properties?.model;
    if (typeof value !== 'string' || !value.trim()) return null;
    try { const url = new URL(value.trim().replace(/\\/g, '/'), BASE); url.searchParams.set('assetrev', String(feature?.properties?.model_hash || BORDER_ASSET_REVISION)); return url.href; }
    catch (_) { return null; }
  };
  const borderCandidates = borderModels.features.filter(f => borderModelUrl(f) !== null);
  const BORDER_MODEL_MIN_ZOOM = 14.0;

  // Train routes are derived from the same roads.geojson rail centrelines used to
  // generate the 3D railway meshes. Nearby line endpoints are snapped together so
  // a train can continue across adjacent source features instead of stopping at
  // every GeoJSON way boundary. Coordinates are local east/north metres.
  const TRAIN_MIN_ZOOM = 14.5;
  const TRAIN_RAILHEAD_HEIGHT = 0.48;       // rail top above the generated ballast base
  const TRAIN_ROUTE_MAX_LENGTH = 12000;     // long enough for trains to traverse the visible area and leave naturally
  const TRAIN_MAX_ROUTE_SEGMENTS = 180;      // safety cap for dense junctions
  const TRAIN_MIN_SEGMENT_LENGTH_METRES = 0.5; // retain short OSM ways, including bridge spans/connectors
  const TRAIN_NODE_SNAP_METRES = 7;
  const trainRailNodes = [];
  const trainRailSegments = [];
  const trainRailBuckets = new Map();
  function trainNodeFor(point) {
    const cell = TRAIN_NODE_SNAP_METRES;
    const gx = Math.floor(point[0] / cell), gy = Math.floor(point[1] / cell);
    let best = -1, bestD2 = cell * cell;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const list = trainRailBuckets.get(`${gx + ox},${gy + oy}`);
      if (!list) continue;
      for (const id of list) {
        const n = trainRailNodes[id];
        const dx = n.point[0] - point[0], dy = n.point[1] - point[1], d2 = dx * dx + dy * dy;
        if (d2 <= bestD2) { best = id; bestD2 = d2; }
      }
    }
    if (best >= 0) return best;
    const id = trainRailNodes.length, key = `${gx},${gy}`;
    trainRailNodes.push({ point: point.slice(), edges: [] });
    if (!trainRailBuckets.has(key)) trainRailBuckets.set(key, []);
    trainRailBuckets.get(key).push(id);
    return id;
  }
  function trainPathCumulative(points) {
    const cumulative = [0];
    for (let i = 1; i < points.length; i++)
      cumulative.push(cumulative[i - 1] + Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]));
    return cumulative;
  }
  const isBridgeValue = value => value === true || value === 1 ||
    (typeof value === 'string' && ['true', 'yes', '1'].includes(value.trim().toLowerCase()));
  function buildTrainRailGraph(features) {
    for (const feature of features) {
      const props = feature.properties || {};
      if (String(props.kind || '').toLowerCase() !== 'rail') continue;
      const geometry = feature.geometry;
      const lines = geometry?.type === 'LineString' ? [geometry.coordinates]
        : geometry?.type === 'MultiLineString' ? geometry.coordinates : [];
      for (const line of lines) {
        const points = [];
        for (const coord of line || []) {
          if (!coord || !Number.isFinite(Number(coord[0])) || !Number.isFinite(Number(coord[1]))) continue;
          const local = frame.toLocal(Number(coord[0]), Number(coord[1]));
          if (!points.length || Math.hypot(local[0] - points.at(-1)[0], local[1] - points.at(-1)[1]) > 0.05) points.push(local);
        }
        if (points.length < 2) continue;
        let cumulative = trainPathCumulative(points);
        if (cumulative.at(-1) < TRAIN_MIN_SEGMENT_LENGTH_METRES) continue;
        const startNode = trainNodeFor(points[0]);
        const endNode = trainNodeFor(points.at(-1));
        points[0] = trainRailNodes[startNode].point.slice();
        points[points.length - 1] = trainRailNodes[endNode].point.slice();
        cumulative = trainPathCumulative(points);
        const length = cumulative.at(-1);
        if (length < TRAIN_MIN_SEGMENT_LENGTH_METRES || startNode === endNode) continue;
        const id = trainRailSegments.length;
        const segment = { id, points, cumulative, length, startNode, endNode,
          from: toYear(props.from_year) ?? -99999, to: toYear(props.to_year) ?? 99999,
          bridge: isBridgeValue(props.bridge),
          sourceId: props.id ?? props.src ?? null, name: props.name ?? null };
        trainRailSegments.push(segment);
        trainRailNodes[startNode].edges.push(id);
        trainRailNodes[endNode].edges.push(id);

    }
  }
  buildTrainRailGraph(roads.features);

  // ---- style (static: every layer in its final order, so MapLibre never has to re-stack the terrain)
  const slider = $('yearSlider'), yearEl = $('year');
  const timelineIndex = () => Number(slider.value);
  const year = () => timelineIndex();
  const timelineLabel = () => String(year());
  const updateTimelineLabel = () => { yearEl.textContent = timelineLabel(); };
  updateTimelineLabel();
  const y0 = year();

  // ---- change points: the moments at which each source's visible set can change. During a slider drag or playback,
  // a source is only re-filtered (which makes MapLibre re-tile it) when the year crosses one of its change points.
  const EPS = 1e-6;
  const changePoints = (feats, startKeys, endKeys) => {
    const set = new Set();
    for (const f of feats) {
      const p = f.properties || {};
      for (const k of startKeys) { const v = p[k]; if (Number.isFinite(v) && Math.abs(v) < 90000) set.add(v); }
      for (const k of endKeys)   { const v = p[k]; if (Number.isFinite(v) && Math.abs(v) < 90000) set.add(v + EPS); }
    }
    return Float64Array.from(set).sort();
  };
  const slotOf = (pts, y) => { let lo = 0, hi = pts.length; while (lo < hi) { const m = (lo + hi) >> 1; if (pts[m] <= y) lo = m + 1; else hi = m; } return lo; };
  const basePts = changePoints(base.features, ['_from'], ['_to']);
  const roadPts = changePoints([...roads.features, ...roadAreas.features],
    ['_road_from', '_road_cobble_year', '_road_tarmac_year', '_road_marking_year'], ['_road_to']);
  const forestPts = changePoints(forests.features, ['_from'], ['_to']);
  const buildingPts = master ? changePoints(master.features, ['_from'], ['_to']) : new Float64Array(0);
  // urban-ground colours only change when the year crosses a hard_surface_year, so restyle it only then
  const urbanHardPts = changePoints(base.features, ['_urban_hard_from'], []);
  let urbanSlot = -1;
  const slots = { base: slotOf(basePts, y0), roads: slotOf(roadPts, y0), forests: slotOf(forestPts, y0), buildings: slotOf(buildingPts, y0) };

  // Visible from from_year (or `undated` when there is none) up to and including to_year.
  // (undated features already got their defaults baked into _from/_to by datedProps)
  const dated = y => [['<=', ['get', '_from'], y], ['>=', ['get', '_to'], y]];
  const dateF = dated, buildingDateF = dated, forestDateF = dated;
  // Muted earth before hard surfacing; neutral weathered stone/concrete afterwards.
  // `_urban_hard_from` defaults to 99999, so an unspecified hard_surface_year stays brown.
  const urbanGroundColour = y => ['case', ['<=', ['get', '_urban_hard_from'], y], '#85837d', '#8b765f'];
  const urbanGroundOutline = y => ['case', ['<=', ['get', '_urban_hard_from'], y], '#696862', '#705e49'];

  const K = (kind, cls) => cls
    ? ['all', ['==', ['get', 'kind'], kind], ['==', ['get', 'cls'], cls]]
    : ['==', ['get', 'kind'], kind];
  const zoomW = (a, b) => ['interpolate', ['linear'], ['zoom'], 12, a, 17, b];

  const groundImages = await groundImagesPromise;      // initial season, ready before the map exists
  Loader.set('tex', 1, 'Starting the map…');
  const texVisible = $('texVis').checked ? 'visible' : 'none';
  const baseDefs = [
    { id: 'base-green', type: 'fill', kf: K('green'), paint: {
        'fill-color': greenColour(season0),
        'fill-opacity': 0.9, 'fill-outline-color': '#92aa79' } },
    { id: 'base-wood', type: 'fill', kf: K('wood'), paint: { 'fill-color': '#bbd19e' } },
    { id: 'base-water', type: 'fill', kf: K('water'), paint: { 'fill-color': '#a8cfe6' } },
    { id: 'base-stream', type: 'line', kf: ['all', K('waterway'), ['!=', ['get', 'cls'], 'river']],
      paint: { 'line-color': '#8fbbdc', 'line-width': zoomW(1, 3) } },
    { id: 'base-river', type: 'line', kf: K('waterway', 'river'),
      paint: { 'line-color': '#8fbbdc', 'line-width': zoomW(3, 16) } },

  // Buffered road polygons: true ground dimensions, drawn by MapLibre and draped over the terrain.
  // The filter definitions below use MapLibre's property-name filter syntax. Material dates were

  const ROAD_AREA_FILTER = ['in', 'kind', 'rail', 'road', 'path', 'trail'];
  const ROAD_CARRIAGEWAY_FILTER = ['==', '_road_surface', 'carriageway'];
  const ROAD_TRACK_FILTER = ['==', '_road_surface', 'track'];

  const roadAreaDateFilters = y => [
    ['<=', '_road_from', y],
    ['>=', '_road_to', y],
  ];

    track: ['all', ['in', '_road_surface', 'track', 'path'], ...roadAreaDateFilters(y)],
    earlyRoad: ['all', ROAD_CARRIAGEWAY_FILTER, ['>', '_road_cobble_year', y], ...roadAreaDateFilters(y)],
    cobbledRoad: ['all', ROAD_CARRIAGEWAY_FILTER, ['<=', '_road_cobble_year', y], ['>', '_road_tarmac_year', y], ...roadAreaDateFilters(y)],
    asphaltRoad: ['all', ROAD_CARRIAGEWAY_FILTER, ['<=', '_road_tarmac_year', y], ...roadAreaDateFilters(y)],
    rail: ['all', ROAD_RAIL_FILTER, ...roadAreaDateFilters(y)],
    majorTarmac: ['all', ['==', 'kind', 'road'], ['==', 'cls', 'major'], ['<=', '_road_tarmac_year', y], ...roadAreaDateFilters(y)],
    majorMarked: ['all', ['==', 'kind', 'road'], ['==', 'cls', 'major'], ['<=', '_road_marking_year', y], ...roadAreaDateFilters(y)],
    trackLines: ['all', ['==', 'kind', 'road'], ['==', 'cls', 'track'], ...roadAreaDateFilters(y)],
  });

  const fadeIn = (a, b, o) => ['interpolate', ['linear'], ['zoom'], a, 0, b, o];
  const ROAD_AREA_LAYERS = [
    { id: 'road-areas-base', source: 'roadAreas', type: 'fill', filterKey: 'all', paint: {
        'fill-color': ['case', ROAD_RAIL, '#77736b', ROAD_TRACK, '#806548', ROAD_PATH, '#987f5d',
          ['==', ['get', 'cls'], 'major'], '#927858', '#aa9678'],
        'fill-outline-color': ['case', ROAD_RAIL, '#504d48', ROAD_TRACK, '#55412f', ROAD_PATH, '#6f593e', '#736047'],
        'fill-opacity': 0.98 } },
    // A separate opaque asphalt undercoat is essential: transparent pixels in the repeating
    // asphalt grain reveal the surface beneath, which must be tarmac rather than historic brown earth.
    { id: 'road-areas-asphalt-base', source: 'roadAreas', type: 'fill', filterKey: 'asphaltRoad', paint: {
        'fill-color': '#292d31', 'fill-outline-color': '#41464a', 'fill-opacity': 1 } },
    { id: 'road-areas-track-texture', minzoom: 13.5, source: 'roadAreas', type: 'fill', filterKey: 'track', paint: {
        'fill-pattern': `road:mud:${season0}`, 'fill-opacity': fadeIn(13.5, 14.5, 0.97) } },
    { id: 'road-areas-old-road-texture', minzoom: 13.5, source: 'roadAreas', type: 'fill', filterKey: 'earlyRoad', paint: {
        'fill-pattern': `road:earth:${season0}`, 'fill-opacity': fadeIn(13.5, 14.5, 0.88) } },
    { id: 'road-areas-cobble-texture', minzoom: 13.5, source: 'roadAreas', type: 'fill', filterKey: 'cobbledRoad', paint: {
        'fill-pattern': `road:cobble:${season0}`, 'fill-opacity': fadeIn(13.5, 14.5, 0.92) } },
    { id: 'road-areas-asphalt-texture', minzoom: 13.5, source: 'roadAreas', type: 'fill', filterKey: 'asphaltRoad', paint: {
        'fill-color': '#52555c', 'fill-pattern': `road:asphalt:${season0}`, 'fill-opacity': fadeIn(13.5, 14.5, 0.97) } },
    { id: 'road-areas-rail-texture', minzoom: 13.5, source: 'roadAreas', type: 'fill', filterKey: 'rail', paint: {
        'fill-pattern': `road:ballast:${season0}`, 'fill-opacity': fadeIn(13.5, 14.5, 0.88) } },
    // Track wheel-ruts and a muted grassy crown. These are thin map strokes on the original centreline,
    // not road-width strokes, so they add texture without reintroducing the heavy meshes.
    { id: 'road-track-rut-left', minzoom: 15, source: 'roads', type: 'line', filterKey: 'trackLines', paint: {
        'line-color': '#443323', 'line-width': zoomW(0.25, 0.85), 'line-offset': zoomW(-0.65, -1.8),
        'line-opacity': 0.62, 'line-blur': 0.25 } },
    { id: 'road-track-rut-right', minzoom: 15, source: 'roads', type: 'line', filterKey: 'trackLines', paint: {
        'line-color': '#443323', 'line-width': zoomW(0.25, 0.85), 'line-offset': zoomW(0.65, 1.8),
        'line-opacity': 0.62, 'line-blur': 0.25 } },
    { id: 'road-track-grass-crown', minzoom: 15, source: 'roads', type: 'line', filterKey: 'trackLines', paint: {
        'line-color': '#899064', 'line-width': zoomW(0.2, 0.8), 'line-opacity': 0.46 } },
    // Modern major roads: solid edge paint and a broken centre line from the configured marking year.

        'line-color': '#eeeade', 'line-width': zoomW(0.25, 0.8), 'line-offset': zoomW(-0.6, -2.0),
        'line-opacity': 0.82 } },
    { id: 'road-marking-edge-right', minzoom: 15, source: 'roads', type: 'line', filterKey: 'majorTarmac', paint: {
        'line-color': '#eeeade', 'line-width': zoomW(0.25, 0.8), 'line-offset': zoomW(0.6, 2.0),
        'line-opacity': 0.82 } },
    { id: 'road-marking-centre', minzoom: 15, source: 'roads', type: 'line', filterKey: 'majorMarked', paint: {
        'line-color': '#fffdf2', 'line-width': zoomW(0.3, 1.0), 'line-dasharray': [3.2, 3.0],
        'line-opacity': 0.92 } },
  ];
  const ROAD_AREA_LAYER_IDS = ROAD_AREA_LAYERS.map(d => d.id);

  const histMaps = (mapsCfg.maps || [])
    .filter(m => m.tiles && m.from_year != null && m.to_year != null)
    .sort((a, b) => a.from_year - b.from_year);
  histMaps.forEach((m, i) => { m.layerId = `hist-map-${i}`; });

  // Everything outside the area is covered by a solid black polygon with the area cut out of it.
  const mask = { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [
    [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]],
    [[W, S], [W, N], [E, N], [E, S], [W, S]],
  ] } };

  const OSM = '© OpenStreetMap contributors, © OpenHistoricalMap contributors';
  const sources = {
    dem: { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, tiles: demTiles, maxzoom: demMax,
           bounds: DEM_BOUNDS, ...(demMeta ? { minzoom: demMeta.minzoom } : {}),
           attribution: 'Terrain: Scottish Government LiDAR (OGL) / Mapzen' },
    base:    { type: 'geojson', data: base,    maxzoom: 16, attribution: OSM },
    roads:      { type: 'geojson', data: roads,      maxzoom: 16, attribution: OSM },
    roadAreas:  { type: 'geojson', data: roadAreas,  maxzoom: 16, attribution: OSM },
    forests:    { type: 'geojson', data: forests,    maxzoom: 16 },
    mask:    { type: 'geojson', data: { type: 'FeatureCollection', features: [mask] }, maxzoom: 14 },
    // A translucent area polygon lets night mode dim MapLibre's terrain/ground layers too.
    nightOverlay: { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: {

    } } },
  };
  if (master) sources['master-buildings'] = { type: 'geojson', data: master, maxzoom: 16, attribution: '© OpenStreetMap contributors, © OpenHistoricalMap' };
  const histVisible = m => m.from_year <= y0 && y0 <= m.to_year;
  histMaps.forEach(m => {
    sources[m.layerId] = { type: 'raster', tiles: [absUrl(m.tiles)], tileSize: m.tileSize || 256,
      minzoom: m.minzoom ?? 0, maxzoom: m.maxzoom ?? 17, bounds: m.bounds || padBounds(AREA, 0.0008),
      attribution: m.attribution || 'Map: National Library of Scotland' };
  });

  // Order matters: all draped (terrain-hugging) layers first, ending with the black mask, then the 3D
  // layers. That needs a single terrain pass; interleaving them would cost an extra pass per switch.
  const layers = [
    { id: 'bg', type: 'background', paint: { 'background-color': GREEN_TINT[season0] } },
    ...baseDefs.flatMap(d => {
      const layer = { id: d.id, type: d.type, source: 'base', filter: ['all', d.kf, ...dateF(y0)], paint: d.paint,
        ...(d.type === 'line' ? { layout: { 'line-cap': 'butt', 'line-join': 'round' } } : {}) };
      if (d.id === 'base-wood' && forests.features.length) layer.layout = { visibility: 'none' };
      const grassTexture = { id: 'grass-texture', type: 'fill', source: 'base', minzoom: 14, layout: { visibility: texVisible },
        filter: ['all', K('green'), ['!', ['in', ['get', 'cls'], ['literal', NO_GRASS_TEXTURE]]], ...dateF(y0)],
        paint: { 'fill-pattern': `tex:grass:${season0}`, 'fill-opacity': fadeInFrom14(TEXTURE_OPACITY.grass) } };
      const woodTexture = (id, kind, test) => ({ id, type: 'fill', source: 'forests', minzoom: 14, layout: { visibility: texVisible },
        filter: ['all', ...forestDateF(y0), test], paint: { 'fill-pattern': `tex:${kind}:${season0}`, 'fill-opacity': fadeInFrom14(TEXTURE_OPACITY[kind]) } });
      if (d.id === 'base-green') return [layer, grassTexture];
      return d.id === 'base-wood'
        ? [layer,
           { id: 'forest-floor', type: 'fill', source: 'forests', filter: ['all', ...forestDateF(y0)],
             paint: { 'fill-color': forestFloorColour(season0), 'fill-opacity': 0.9 } },
           woodTexture('forest-litter', 'litter', ['!=', ['get', 'tree_type'], 'conifer']),
           woodTexture('forest-needles', 'needles', ['==', ['get', 'tree_type'], 'conifer'])]
        : [layer];
    }),
    ...histMaps.map(m => ({ id: m.layerId, type: 'raster', source: m.layerId,
      layout: { visibility: histVisible(m) ? 'visible' : 'none' },
      paint: { 'raster-opacity': parseFloat($('mapOpacity').value), 'raster-fade-duration': 0 } })),
    { id: 'hillshade-dem', type: 'hillshade', source: 'dem', paint: { 'hillshade-exaggeration': 0.35 } },
    // Urban ground sits above the terrain/hillshade and grass textures, but below
    // road surfaces, building footprints/extrusions and the Three.js building models.
    { id: 'urban-ground', type: 'fill', source: 'base',
      filter: ['all', ['==', ['get', 'kind'], 'urban'], ...dateF(y0)],
      layout: { visibility: $('urbanGroundVis').checked ? 'visible' : 'none' },
      paint: { 'fill-color': urbanGroundColour(y0), 'fill-outline-color': urbanGroundOutline(y0), 'fill-opacity': 0.96,
        'fill-color-transition': { duration: 0 }, 'fill-outline-color-transition': { duration: 0 } } },
    ...ROAD_AREA_LAYERS.map(d => ({ id: d.id, type: d.type, source: d.source, ...(d.minzoom != null ? { minzoom: d.minzoom } : {}),
      filter: roadAreaFilters(y0)[d.filterKey],

    for (let i = 0; i < route.points.length - 1; i++) {
      const a = route.points[i], b = route.points[i + 1];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const length2 = dx * dx + dy * dy;
      if (length2 < 1e-8) continue;
      const t = Math.max(0, Math.min(1, ((target[0] - a[0]) * dx + (target[1] - a[1]) * dy) / length2));
      const px = a[0] + dx * t, py = a[1] + dy * t;
      const distance = Math.hypot(target[0] - px, target[1] - py);
      if (!best || distance < best.offset) {
        const along = route.cumulative[i] + Math.sqrt(length2) * t;
        best = { offset: distance, distance: along };
      }

  }
  function findTrainStationStop(route, config, progress) {

      const nearest = nearestTrainRouteDistance(route, target);
      if (!nearest || nearest.offset > TRAIN_STATION_STOP_RADIUS) continue;
      // Stop the locomotive around the platform centre; only stop if the station
      // is genuinely ahead and there is enough route left to approach it safely.

      route.points[lo][0] + (route.points[lo + 1][0] - route.points[lo][0]) * t,

  function trainPoint3(route, distance) {

    for (const span of route.bridgeRanges || []) {

      const spanLength = Math.max(0.01, span.endDistance - span.startDistance);
      const t = Math.max(0, Math.min(1, (distance - span.startDistance) / spanLength));

      const endGround = Number(heightAt(span.endPoint[0], span.endPoint[1]));

  function removeActiveTrain(index) {

    activeTrains.splice(index, 1);
  }

  }
  function updateTrainTraffic(timeSeconds) {
    const now = Number(timeSeconds) || 0;
    if (trainLastUpdate == null) trainLastUpdate = now;
    const dt = Math.min(0.08, Math.max(0, now - trainLastUpdate));
    trainLastUpdate = now;
    const selectedYear = year();
    for (let i = activeTrains.length - 1; i >= 0; i--) {
      const train = activeTrains[i];
      if (selectedYear < train.route.from || selectedYear > train.route.to) { removeActiveTrain(i); continue; }

      if (train.state === 'dwelling') {
        // Keep the whole consist in place at Dunkeld & Birnam while the dwell timer runs.
        train.speed = 0;
        if (now >= train.departAt) train.state = 'departing';
      }

      if (train.state === 'moving' || train.state === 'departing') {
        const terminalDistance = train.endInView ? train.stopDistance : Infinity;
        const stationDistance = Number.isFinite(train.stationStopDistance) ? train.stationStopDistance : Infinity;
        const stationIsNext = stationDistance < terminalDistance;
        const targetDistance = Math.min(terminalDistance, stationDistance);
        if (Number.isFinite(targetDistance)) {
          const remaining = Math.max(0, targetDistance - train.progress);
          if (train.state === 'departing') {
            const cruise = train.cruiseSpeed;
            train.speed = Math.min(cruise, train.speed + 0.65 * dt);
            train.progress += train.speed * dt;
            train.travelled += train.speed * dt;
            if (train.speed >= cruise - 0.01) train.state = 'moving';
          } else {
            const safeSpeed = Math.sqrt(2 * TRAIN_BRAKE_DECEL * remaining);
            train.speed = Math.min(train.speed, safeSpeed);
            train.progress += train.speed * dt;
            train.travelled += train.speed * dt;
          }
          const afterTarget = targetDistance - train.progress;
          if (afterTarget <= 0.10 || (train.speed < 0.12 && afterTarget < 0.8)) {
            train.progress = targetDistance;
            train.speed = 0;
            if (stationIsNext) {
              train.state = 'dwelling';
              train.stationStopDistance = null; // one scheduled call at this station per pass
              train.departAt = now + trainRandom(TRAIN_STATION_DWELL_MIN, TRAIN_STATION_DWELL_MAX);
              train.lastStopName = train.stationStopName || 'Dunkeld & Birnam';
            } else {
              train.state = 'parked';
              train.parkedSince = now;
            }
          }
        } else if (train.state === 'departing') {
          const cruise = train.cruiseSpeed;
          train.speed = Math.min(cruise, train.speed + 0.65 * dt);
          train.progress += train.speed * dt;
          train.travelled += train.speed * dt;
          if (train.speed >= cruise - 0.01) train.state = 'moving';
        } else {
          train.progress += train.speed * dt;
          train.travelled += train.speed * dt;
          // The route continues past the map edge. Remove only after the last coach
          // has completely cleared the end; never reverse to keep it on screen.
          if (train.progress > train.route.length + train.rearExtent + TRAIN_END_CLEARANCE) {
            removeActiveTrain(i);

          }

      }

      applyTrainVehiclePose(train.root, train.route, train.progress);
      for (const wheel of train.wheels)
        wheel.object.rotation.x = wheel.baseRotation - train.travelled / wheel.radius;
      for (const coach of train.coaches || []) {
        applyTrainVehiclePose(coach.root, train.route, train.progress - coach.offset);
        for (const wheel of coach.wheels)

    }
    if (!trainAnimationNeeded()) syncAnim();
    if (trainTrafficOn && canSpawnTrain() && !trainSpawnTimer)
      scheduleTrainSpawn(activeTrains.length ? trainRandom(18, 34) : trainRandom(5, 12));
  }
  function routeTouchesView(route, view) {
    for (const point of route.points) {
      const ll = frame.toLonLat(point[0], point[1]);
      if (inBounds(ll, view)) return true;
    }
    return false;
  }
  async function spawnRandomTrain() {
    if (!trainTrafficOn || map.getZoom() < TRAIN_MIN_ZOOM || !canSpawnTrain()) return false;
    const view = paddedView();
    let route = null;
    for (let attempt = 0; attempt < 18; attempt++) {
      const candidate = buildRandomTrainRoute(year());
      if (candidate && routeTouchesView(candidate, view)) { route = candidate; break; }
    }
    if (!route) return false;
    const config = trainFleetForYear(year());
    const rearExtent = trainRearExtent(config);
    const coachOffsets = trainCoachOffsets(config);
    const paths = [config.locomotive, ...(config.coaches ? [config.coaches] : [])];
    const templates = await Promise.all(paths.map(path => ensureTrainTemplate(path)));
    if (!trainTrafficOn || map.getZoom() < TRAIN_MIN_ZOOM || !canSpawnTrain()) return false;
    const root = templates[0].clone(true);
    root.name = `${config.id}-train-${++trainSerial}`;
    const wheels = collectTrainWheels(root);
    const coaches = [];
    for (let i = 0; i < config.coachCount; i++) {
      const coachRoot = templates[1].clone(true);
      coachRoot.name = `${config.id}-coach-${trainSerial}-${i+1}`;
      coaches.push({ root: coachRoot, offset: coachOffsets[i], wheels: collectTrainWheels(coachRoot) });
    }
    const candidates = [];
    for (let i = 0; i < route.points.length; i++) {
      const ll = frame.toLonLat(route.points[i][0], route.points[i][1]);
      if (inBounds(ll, view)) candidates.push(route.cumulative[i]);
    }
    const visibleDistance = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : route.length * 0.5;
    const minimumProgress = Math.min(route.length * 0.45, rearExtent + 5.0);
    const progress = Math.max(minimumProgress, Math.min(route.length - config.locoFrontExtent - 5.0,
      visibleDistance + trainRandom(-35, 35)));
    const endInView = routeEndInView(route, view);
    const stopDistance = endInView ? Math.max(minimumProgress, route.length - config.locoFrontExtent) : null;
    const stationStop = findTrainStationStop(route, config, progress);
    const cruiseSpeed = trainRandom(config.speedMin || TRAIN_MIN_SPEED, config.speedMax || TRAIN_MAX_SPEED);
    const train = {
      root, coaches, route, config, progress,
      speed: cruiseSpeed, cruiseSpeed,
      travelled: 0, wheels, state: 'moving', stopDistance, endInView, rearExtent,
      stationStopDistance: stationStop?.distance ?? null,
      stationStopName: stationStop?.name ?? null,
    };
    trainGroup.add(root);
    for (const coach of coaches) trainGroup.add(coach.root);
    applyTrainVehiclePose(root, route, progress);
    for (const coach of coaches) applyTrainVehiclePose(coach.root, route, progress - coach.offset);

  }
  function scheduleTrainSpawn(delaySeconds = trainRandom(18, 32)) {
    if (!trainTrafficOn || !trainRailSegments.length || document.hidden || map.getZoom() < TRAIN_MIN_ZOOM || trainSpawnTimer || !canSpawnTrain()) return;
    trainSpawnTimer = setTimeout(async () => {
      trainSpawnTimer = null;
      try {
        const spawned = await spawnRandomTrain();
        if (spawned && canSpawnTrain()) scheduleTrainSpawn(trainRandom(24, 42));
        else if (!spawned && canSpawnTrain()) scheduleTrainSpawn(trainRandom(10, 18));
      } catch (_) {

      }

  }
  function ensureTrainTraffic() {
    if (!trainTrafficOn || !trainRailSegments.length || document.hidden || map.getZoom() < TRAIN_MIN_ZOOM) return;
    if (canSpawnTrain()) scheduleTrainSpawn(activeTrains.length ? trainRandom(18, 34) : trainRandom(3, 7));
  }
  function setTrainTrafficEnabled(enabled) {

    if (!trainTrafficOn) {
      if (trainSpawnTimer) clearTimeout(trainSpawnTimer);
      trainSpawnTimer = null;
      for (let i = activeTrains.length - 1; i >= 0; i--) removeActiveTrain(i);
      trainLastUpdate = null;
    } else ensureTrainTraffic();
    syncAnim();
    map.triggerRepaint();
  }

  // ---- models: GLB geometry is baked into BatchedMesh batches. Each building remains an
  // independently visible/pickable set of batch instances, while no Object3D hierarchy is
  // retained for every building. Terrain elevation is sampled once from the loaded heightfield.
  // Per-model templates share their source GLB geometry, while each building receives its own
  // set of BatchedMesh instance IDs. modelItems/modelIds/modelState and the renderer matrices
  // are declared with the shared scene above.
  const modelTemplateCache = new Map();
  const modelBatches = new Set();
  const modelFallbackRoots = new Set();

  // Window materials use a deliberately simple two-name contract in the source GLBs:
  //   window_glass       = ordinary, non-emissive glazing
  //   window_glow_bright = warm illuminated glazing at night
  // Materials are updated in place, so the BatchedMesh instances do not need rebuilding.
  const windowGlowMaterials = new Map();
  const windowGlassMaterials = new Map();
  // Per-source-GLB inventory is also exposed through diagnostics so material-name mismatches
  // can be spotted immediately when a model is loaded.
  const modelMaterialDiagnostics = new Map();

  // Rich candle/lamplight amber, slightly redder than the previous pale peach-gold.
  const WINDOW_GLOW_COLOUR = 0xffa447;
  const WINDOW_GLOW_INTENSITY = 2.25;
  // Unlit panes become darker and subtly cooler at night, helping the lit panes read clearly.
  const WINDOW_GLASS_NIGHT_RGB = [0.62, 0.70, 0.86];

  function normaliseWindowMaterialName(name) {
    // GLTF exporters sometimes suffix duplicate material names with .001, .002, etc.
    return String(name || '').trim().toLowerCase().replace(/\.\d{3,}$/, '');
  }
  function windowMaterialKind(material) {
    const name = normaliseWindowMaterialName(material?.name);
    if (name === 'window_glass') return 'glass';
    if (name === 'window_glow_bright') return 'glow_bright';
    return null;
  }
  function setWindowGlowMaterialNight(material, enabled) {
    if (!material?.emissive) return;
    if (enabled) {
      material.emissive.setHex(WINDOW_GLOW_COLOUR);
      material.emissiveIntensity = WINDOW_GLOW_INTENSITY;
    } else {
      material.emissive.setHex(0x000000);
      material.emissiveIntensity = 0;
    }
  }
  function setWindowGlassMaterialNight(entry, enabled) {
    const material = entry.material;
    if (!material?.color || !entry.originalColour) return;
    if (enabled) {
      material.color.setRGB(
        entry.originalColour.r * WINDOW_GLASS_NIGHT_RGB[0],
        entry.originalColour.g * WINDOW_GLASS_NIGHT_RGB[1],
        entry.originalColour.b * WINDOW_GLASS_NIGHT_RGB[2]

    } else {
      material.color.copy(entry.originalColour);
    }
  }
  function registerWindowMaterial(material) {
    if (!material) return;
    const kind = windowMaterialKind(material);
    if (kind === 'glow_bright' && material.emissive) {
      if (!windowGlowMaterials.has(material.uuid)) {
        windowGlowMaterials.set(material.uuid, { material, name: material.name || 'window_glow_bright' });
      }
      setWindowGlowMaterialNight(material, $('nightMode').checked);
    } else if (kind === 'glass' && material.color) {
      if (!windowGlassMaterials.has(material.uuid)) {
        const entry = { material, name: material.name || 'window_glass', originalColour: material.color.clone() };
        windowGlassMaterials.set(material.uuid, entry);
      }
      setWindowGlassMaterialNight(windowGlassMaterials.get(material.uuid), $('nightMode').checked);
    }
  }

    for (const entry of windowGlassMaterials.values())
      setWindowGlassMaterialNight(entry, enabled);
  }
  function scanWindowMaterialsInScene(sourceScene, url) {
    let meshCount = 0;
    const seen = new Map();
    sourceScene.traverse(node => {
      if (!node.isMesh) return;
      meshCount++;
      const materials = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of materials) {
        if (!material) continue;
        const name = String(material.name || '').trim();
        const kind = windowMaterialKind(material);

          name, type: material.type || material.constructor?.name || 'Unknown',

      url, meshCount, materialCount: seen.size,

      windowGlowBrightCount: [...seen.values()].filter(x => x.windowKind === 'glow_bright').length,

  const paddedView = () => {
    const b = map.getBounds(), w = b.getEast() - b.getWest(), h = b.getNorth() - b.getSouth();

  };
  map.on('moveend', () => { ensureModels(); ensureRailwayModels(); ensureBorderModels(); ensureTrainTraffic(); });

  // Geometry layout is part of the batch key: BatchedMesh requires all geometries in one
  // batch to expose the same attributes. Each batch uses a single shared material.
  const geometryLayoutKey = geometry => Object.entries(geometry.attributes).sort(([a], [b]) => a.localeCompare(b))
    .map(([name, attr]) => `${name}:${attr.itemSize}:${attr.normalized ? 1 : 0}:${attr.array.constructor.name}`).join('|');

    const g = source.clone();
    // GLTFLoader can produce valid InterleavedBufferAttributes. BatchedMesh's
    // geometry packing expects ordinary BufferAttributes, so de-interleave each
    // attribute on this private clone (never mutate the cached/source GLB geometry).
    // InterleavedBufferAttribute.clone() without a shared-data map returns a
    // standalone BufferAttribute with the same component values and normalization.
    for (const [name, attr] of Object.entries(g.attributes)) {
      if (attr?.isInterleavedBufferAttribute) g.setAttribute(name, attr.clone());
    }
    g.clearGroups();
    const sourceCount = source.index ? source.index.count : source.attributes.position.count;

    const count = Math.max(0, Math.min(Number(group.count) || (sourceCount - start), sourceCount - start));

      g.setIndex(Array.from({ length: count }, (_, i) => start + i));

  async function getModelTemplate(url, sourceScene) {
    if (modelTemplateCache.has(url)) return modelTemplateCache.get(url);
    const pending = (async () => {
      sourceScene.updateMatrixWorld(true);
      const rootInverse = sourceScene.matrixWorld.clone().invert();
      const rootPosition = sourceScene.position.clone();
      const rootRotation = sourceScene.rotation.clone();
      const byBatchKey = new Map(), entries = [], meshMatrices = [];

      // Three.js r160 BatchedMesh does not support skinned or morph-target geometry.
      // Keep these uncommon GLBs on the ordinary Mesh path rather than dropping them.

        if (node.isMesh) {

        if (!mesh.isMesh || !mesh.geometry?.attributes?.position) return;
        const thisMeshIndex = meshIndex++;
        meshMatrices[thisMeshIndex] = rootInverse.clone().multiply(mesh.matrixWorld);
        const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
        const geometry = mesh.geometry;
        const groups = geometry.groups.length ? geometry.groups : [{ start: 0, count: geometry.index ? geometry.index.count : geometry.attributes.position.count, materialIndex: 0 }];

          const material = materials[group.materialIndex] || materials[0];
          if (!material) continue;
          const partGeometry = makeModelPartGeometry(geometry, group);
          if (!partGeometry.index || !partGeometry.index.count) { partGeometry.dispose(); continue; }
          const layout = geometryLayoutKey(partGeometry);
          const key = `${material.uuid}|${layout}`;
          let batchGroup = byBatchKey.get(key);

        }

      const urlModelCount = Math.max(1, modelCandidates.filter(f => modelUrl(f) === url).length);
